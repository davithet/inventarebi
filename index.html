    document.getElementById('p_first')?.focus();
  },50);
}

async function addSelectedExcelPeopleToForm(){
  const checks=[...document.querySelectorAll('.excel-person-check:checked')];
  if(!checks.length){alert('ჯერ მონიშნე Excel-იდან ერთი ან რამდენიმე პიროვნება.');return;}
  const saved=await loadExcelImport();
  if(saved?.people?.length){excelImportedPeople=saved.people;excelImportedRows=saved.rows||excelImportedRows;excelImportedMeta=saved.meta||excelImportedMeta}
  const selected=checks.map(ch=>excelImportedPeople[Number(ch.dataset.excelIdx)]).filter(Boolean);
  const existing=new Set();
  // ხელახლა გადავამოწმოთ პირდაპირ Supabase-ში, რათა ძველი cache-ის გამო დუბლიკატი არ დაემატოს.
  const {data:live,error:liveErr}=await db.from('persons').select('serial_no');
  if(liveErr){alert('❌ არსებული N-ების შემოწმება ვერ მოხერხდა: '+liveErr.message);return}
  (live||[]).forEach(x=>{if(x.serial_no!==null&&x.serial_no!==undefined)existing.add(String(x.serial_no).trim())});
  const unique=[]; const seen=new Set(); const skipped=[]; const invalid=[];
  selected.forEach(p=>{
    const n=String(p.serial||p.n||'').trim();
    if(!n){invalid.push(p);return}
    if(existing.has(n)||seen.has(n)){skipped.push(n);return}
    seen.add(n); unique.push(p);
  });
  if(invalid.length) alert(`⚠️ ${invalid.length} მონიშნულ ჩანაწერს N / რიგითი უნიკალური № არ აქვს და გამოტოვდება.`);
  if(!unique.length){alert(`ℹ️ დასამატებელი ახალი პიროვნება ვერ მოიძებნა.\n\nუკვე არსებული/დუბლიკატი N: ${skipped.length}`);return;}
  if(!confirm(`მონიშნულია: ${selected.length}\n\nდასამატებელი ახალი პირები: ${unique.length}\nუკვე არსებული/დუბლიკატი N: ${skipped.length}\n\nდავამატოთ ყველა ახალი პიროვნება ერთდროულად პროგრამაში?`))return;
  let added=0, failed=0, failedDetails=[];
  for(const p of unique){
    const n=Number(String(p.serial||p.n||'').trim());
    const contacts=(Array.isArray(p.contacts)&&p.contacts.length?p.contacts:excelParseContacts(p.phone)).filter(Boolean).slice(0,4);
    const payload={
      serial_no:n,
      first_name:String(p.first||'').trim(),
      last_name:String(p.last||'').trim(),
      personal_id:String(p.personalId||'').trim()||null,
      mobile:contacts.join(' / ')||null,
      room_no:String(p.room||'').trim()||null,
      floor:p.floor!==undefined&&p.floor!==null&&String(p.floor).trim()!==''?Number(p.floor):null,
      position:null, work_phone:null, ip_address:null, mac_address:null,
      notes:`Excel-დან დამატებულია • ${excelImportedMeta.fileName||''}`,
      employed:true
    };
    // საბოლოო დაცვა: თუ ამ N-ს უკვე სხვა მომხმარებელი დაამატებს, ეს ჩანაწერი გამოტოვდეს.
    const check=await db.from('persons').select('id').eq('serial_no',n).limit(1);
    if(check.error){failed++;failedDetails.push(`${n}: ${check.error.message}`);continue}
    if(check.data?.length){skipped.push(String(n));continue}
    const ins=await db.from('persons').insert(payload).select('id').single();
    if(ins.error){failed++;failedDetails.push(`${n}: ${ins.error.message}`);}
    else added++;
  }
  await personsView();
  const detail=failedDetails.length?`\n\n❌ შეცდომით ვერ დაემატა: ${failed}\n${failedDetails.slice(0,10).join('\n')}${failedDetails.length>10?'\n...':''}`:'';
  alert(`✅ ოპერაცია დასრულდა!\n\nდაემატა: ${added}\nგამოტოვდა, რადგან N უკვე არსებობდა: ${skipped.length}\nშეცდომა: ${failed}${detail}`);
}

function runExcelSearch(){
  const box=document.getElementById('excelResults'); if(!box)return;
  const q=excelClean(document.getElementById('excelSearch')?.value).toLowerCase();
  if(!q){box.innerHTML='<div class="status">ჩაწერე საინვენტარო ნომერი ან პიროვნების სახელი/გვარი.</div>';return}
  const matches=excelImportedRows.filter(r=>{
    const hay=[r.inventoryNo,r.personName,r.firstName,r.lastName,r.personalId,r.phone,r.room,r.serial,r.inventoryField,r.sourceValue,r.sheet].join(' ').toLowerCase();
    return hay.includes(q);
  });
  if(!matches.length){box.innerHTML='<div class="inv-status inv-none">⚪ Excel-ში ასეთი მონაცემი ვერ მოიძებნა.</div>';return}
  // Group identical inventory numbers so one inventory number immediately shows its owner(s).
  const groups=new Map();
  matches.forEach(r=>{const k=r.inventoryNo||('row-'+r.sheet+'-'+r.row);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});
  box.innerHTML=[...groups.entries()].map(([inv,arr])=>{
    const owners=[...new Set(arr.map(x=>x.personName).filter(Boolean))];
    const ownerText=owners.length?owners.join(', '):'პიროვნება Excel-ში მითითებული არ არის';
    const first=arr[0];
    return `<div class="excel-owner"><div><b>📦 საინვენტარო № ${esc(inv)}</b></div>
      <div style="margin-top:6px"><b>👤 პასუხისმგებელი პირი:</b> ${esc(ownerText)}</div>
      <div class="hint">ფურცელი: ${esc(first.sheet)} • სტრიქონი: ${esc(first.row)} • ველი: ${esc(first.inventoryField||'')}</div>
      ${arr.map(x=>`<div class="hint">მონაცემი: ${esc(x.sourceValue||'')} ${x.personalId?'• პირადი ID: '+esc(x.personalId):''} ${x.room?'• '+esc(x.room):''}</div>`).join('')}
    </div>`;
  }).join('');
}

globalResults.innerHTML=`<div class="table-wrap"><table><thead><tr><th>წყარო</th><th>სტატუსი</th><th>ტიპი</th><th>№</th><th>ობიექტი</th><th>პასუხისმგებელი</th><th>დამატებითი ინფორმაცია</th></tr></thead><tbody>${filtered.map(r=>{if(r._source==='excel'){return `<tr><td>📊 Excel</td><td>📊 იმპორტირებული</td><td>${esc(r._type)}</td><td><b>${esc(r.inventory_no)}</b></td><td>${esc(r._name)}</td><td><b>${esc(r._excelPerson||'პასუხისმგებელი Excel-ში მითითებული არ არის')}</b></td><td>ფურცელი: ${esc(r._excelSheet||'—')} • სტრიქონი: ${esc(r._excelRow||'—')}${r._excelId?' • პირადი ID: '+esc(r._excelId):''}${r._excelRoom?' • ოთახი: '+esc(r._excelRoom):''}${r._excelFloor?' • სართული: '+esc(r._excelFloor):''}</td></tr>`}const st=r._written?'written':r.person_id?'used':'free';return `<tr><td>☁️ სისტემა</td><td>${st==='free'?'🟡 თავისუფალი':st==='used'?'🟢 გამოყენებაში':'🔴 ჩამოწერილი'}</td><td>${esc(r._type)}</td><td><b>${esc(r.inventory_no)}</b></td><td>${esc(r._name)}</td><td>${esc(people[r.person_id]||r.person_id||'—')}</td><td>${st==='free'?'<span class="badge">თავისუფალია — შესაძლებელია მიბმა</span>':st==='used'?'<span class="badge">გადაცემა შესაძლებელია თანხმობით</span>':'<span class="badge">ჩამოწერილია</span>'}</td></tr>`}).join('')}</tbody></table></div>`}

async function getPersonAll(pid){const results=await Promise.all(inventoryTables.map(async x=>{const {data}=await db.from(x.table).select('*').eq('person_id',pid);return (data||[]).map(r=>({...r,_type:x.type,_name:r[x.nameField]||r.model||''}))}));return results.flat()}
async function printPerson(pid){const {data:p}=await db.from('persons').select('*').eq('id',pid).single();if(!p)return;const inv=await getPersonAll(pid);const w=window.open('','_blank');w.document.write(`<html><head><meta charset="UTF-8"><title>ინვენტარი — ${esc(p.first_name)} ${esc(p.last_name)}</title><style>body{font-family:Arial,sans-serif;padding:30px}h2{text-align:center}table{width:100%;border-collapse:collapse}th,td{border:1px solid #777;padding:7px;text-align:left}th{background:#eee}.info{margin-bottom:18px;line-height:1.8}</style></head><body><h2>პიროვნებაზე მიბმული საინვენტარო სია</h2><div class="info"><b>სახელი გვარი:</b> ${esc(p.first_name)} ${esc(p.last_name)}<br><b>პირადი ID:</b> ${esc(p.personal_id)}<br><b>თანამდებობა:</b> ${esc(p.position)}<br><b>კაბინეტი:</b> ${esc(p.room_no)}<br><b>სართული:</b> ${esc(p.floor)}<br><b>კონტაქტები:</b> ${esc(p.mobile)}<br><b>შიდა ნომერი:</b> ${esc(p.work_phone)}</div><table><tr><th>#</th><th>ტიპი</th><th>საინვენტარო №</th><th>დასახელება</th></tr>${inv.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r._type)}</td><td>${esc(r.inventory_no)}</td><td>${esc(r._name)}</td></tr>`).join('')}</table><p style="margin-top:30px">თარიღი: ${new Date().toLocaleDateString('ka-GE')}</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
async function printAct(pid){const {data:p}=await db.from('persons').select('*').eq('id',pid).single();if(!p)return;const inv=await getPersonAll(pid);const w=window.open('','_blank');w.document.write(`<html><head><meta charset="UTF-8"><title>მიღება-ჩაბარების აქტი</title><style>body{font-family:Arial,sans-serif;padding:35px}h2{text-align:center}p{line-height:1.7}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #555;padding:7px}.sign{display:flex;justify-content:space-between;margin-top:70px}</style></head><body><h2>მიღება-ჩაბარების აქტი</h2><p>წინამდებარე აქტით დასტურდება, რომ საინვენტარო ობიექტები გადაეცა პასუხისმგებელ პირს:</p><p><b>პირი:</b> ${esc(p.first_name)} ${esc(p.last_name)}<br><b>პირადი ID:</b> ${esc(p.personal_id)}<br><b>თანამდებობა:</b> ${esc(p.position)}<br><b>კაბინეტი:</b> ${esc(p.room_no)}<br><b>სართული:</b> ${esc(p.floor)}</p><table><tr><th>#</th><th>ტიპი</th><th>საინვენტარო №</th><th>დასახელება</th></tr>${inv.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r._type)}</td><td>${esc(r.inventory_no)}</td><td>${esc(r._name)}</td></tr>`).join('')}</table><p>პასუხისმგებელი პირი ადასტურებს, რომ აღნიშნული ინვენტარი ჩაიბარა და პასუხისმგებლობას იღებს მის შენახვასა და გამოყენებაზე.</p><div class="sign"><div>გადამცემი: __________________</div><div>მიმღები: __________________</div></div><p style="margin-top:30px">თარიღი: ${new Date().toLocaleDateString('ka-GE')}</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function closeModal(){modal.classList.remove('show');recordForm.onsubmit=null}preloadExcelImport();window.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});init();
