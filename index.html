function idbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(OFF_DB,OFF_VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(OFF_TABLES))d.createObjectStore(OFF_TABLES);if(!d.objectStoreNames.contains(OFF_QUEUE))d.createObjectStore(OFF_QUEUE,{keyPath:"qid",autoIncrement:true});if(!d.objectStoreNames.contains("excel_import"))d.createObjectStore("excel_import")
      if(!d.objectStoreNames.contains("inventory_checklist"))d.createObjectStore("inventory_checklist",{keyPath:"id",autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function idbSetTable(name,rows){const d=await idbOpen();return new Promise((res,rej)=>{const tx=d.transaction(OFF_TABLES,"readwrite");tx.objectStore(OFF_TABLES).put(rows,name);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbGetTable(name){const d=await idbOpen();return new Promise((res,rej)=>{const tx=d.transaction(OFF_TABLES,"readonly");const r=tx.objectStore(OFF_TABLES).get(name);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function idbQueue(item){const d=await idbOpen();return new Promise((res,rej)=>{const tx=d.transaction(OFF_QUEUE,"readwrite");tx.objectStore(OFF_QUEUE).add({...item,queued_at:new Date().toISOString()});tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbQueueAll(){const d=await idbOpen();return new Promise((res,rej)=>{const tx=d.transaction(OFF_QUEUE,"readonly");const r=tx.objectStore(OFF_QUEUE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function idbDeleteQueue(qid){const d=await idbOpen();return new Promise((res,rej)=>{const tx=d.transaction(OFF_QUEUE,"readwrite");tx.objectStore(OFF_QUEUE).delete(qid);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

function localUuid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==="x"?r:(r&3|8);return v.toString(16)})}
function clone(x){return JSON.parse(JSON.stringify(x))}
function applyLocal(q,rows){let a=rows.slice();for(const f of q.filters){if(f.kind==="eq")a=a.filter(r=>String(r[f.col]??"")===String(f.val??""));else if(f.kind==="in")a=a.filter(r=>f.vals.includes(r[f.col]));else if(f.kind==="or")a=a.filter(r=>f.parts.some(p=>{const m=p.match(/^(\w+)\.ilike\.%(.+)%$/);return m&&String(r[m[1]]??"").toLowerCase().includes(m[2].toLowerCase())}));else if(f.kind==="not"&&f.op==="is"&&f.val===null)a=a.filter(r=>r[f.col]!==null&&r[f.col]!==undefined)}if(q.orderCol)a.sort((x,y)=>{const av=x[q.orderCol],bv=y[q.orderCol];if(av==bv)return 0;const z=av>bv?1:-1;return q.orderAsc?z:-z});if(q.limitN!=null)a=a.slice(0,q.limitN);if(q.columns&&q.columns!=="*"){const cols=q.columns.split(",").map(x=>x.trim());a=a.map(r=>{const o={};cols.forEach(c=>o[c]=r[c]);return o})}return a}

class LocalQuery{constructor(table){this.table=table;this.op="select";this.payload=null;this.filters=[];this.orderCol=null;this.orderAsc=true;this.limitN=null;this.columns="*";this.wantSingle=false}
 select(c="*"){this.columns=c;if(this.op==="select")this.op="select";return this} eq(c,v){this.filters.push({kind:"eq",col:c,val:v});return this} in(c,v){this.filters.push({kind:"in",col:c,vals:v});return this} or(x){this.filters.push({kind:"or",parts:x.split(",")});return this} not(c,o,v){this.filters.push({kind:"not",col:c,op:o,val:v});return this} order(c,o={}){this.orderCol=c;this.orderAsc=o.ascending!==false;return this} limit(n){this.limitN=n;return this} single(){this.wantSingle=true;return this}
 insert(payload){this.op="insert";this.payload=Array.isArray(payload)?payload.map(clone):[clone(payload)];return this} update(payload){this.op="update";this.payload=clone(payload);return this} delete(){this.op="delete";return this}
 async exec(){let rows=await idbGetTable(this.table);if(this.op==="select"){const out=applyLocal(this,rows);if(this.wantSingle)return {data:out[0]||null,error:out[0]?null:{message:"No rows found"}};return {data:out,error:null}}
 if(this.op==="insert"){const added=this.payload.map(r=>{const x=clone(r);if(x.id==null)x.id=localUuid();if(x.created_at==null)x.created_at=new Date().toISOString();if(x.updated_at==null)x.updated_at=new Date().toISOString();return x});rows.push(...added);await idbSetTable(this.table,rows);await idbQueue({action:"insert",table:this.table,rows:added});return {data:added.length===1?added[0]:added,error:null}}
 const matched=rows.filter(r=>this.filters.every(f=>f.kind==="eq"?String(r[f.col]??"")===String(f.val??""):f.kind==="in"?f.vals.includes(r[f.col]):true));
 if(this.op==="update"){rows=rows.map(r=>matched.some(m=>m.id===r.id)?{...r,...clone(this.payload),updated_at:new Date().toISOString()}:r);await idbSetTable(this.table,rows);await idbQueue({action:"update",table:this.table,filters:this.filters,payload:clone(this.payload)});const changed=rows.filter(r=>matched.some(m=>m.id===r.id));return {data:this.wantSingle?(changed[0]||null):changed,error:this.wantSingle&&!changed.length?{message:"No rows found"}:null}}
 if(this.op==="delete"){rows=rows.filter(r=>!matched.some(m=>m.id===r.id));await idbSetTable(this.table,rows);await idbQueue({action:"delete",table:this.table,filters:this.filters});return {data:null,error:null}}}
 then(a,b){return this.exec().then(a,b)} catch(a){return this.exec().catch(a)} finally(a){return this.exec().finally(a)}}

class OnlineQuery{constructor(real,table){this.real=real.from(table);this.table=table} select(c="*"){this.real=this.real.select(c);return this} eq(c,v){this.real=this.real.eq(c,v);return this} in(c,v){this.real=this.real.in(c,v);return this} or(x){this.real=this.real.or(x);return this} not(c,o,v){this.real=this.real.not(c,o,v);return this} order(c,o){this.real=this.real.order(c,o);return this} limit(n){this.real=this.real.limit(n);return this} single(){this.real=this.real.single();return this} insert(p){this.real=this.real.insert(p);return this} update(p){this.real=this.real.update(p);return this} delete(){this.real=this.real.delete();return this} then(a,b){return this.real.then(async r=>{if(r&&r.error==null)await cacheTable(this.table);return a?r&&a(r):r},b)} catch(a){return this.real.catch(a)} finally(a){return this.real.finally(a)}}

async function cacheTable(table){if(!sb||!navigator.onLine)return;try{const {data,error}=await sb.from(table).select("*");if(!error)await idbSetTable(table,data||[])}catch(e){console.warn("cache",table,e)}}
async function cacheAllTables(){if(!sb||!navigator.onLine)return;setStatus("☁️ ონლაინ • მონაცემები კომპიუტერში ინახება...");for(const c of Object.values(configs))await cacheTable(c.table);setStatus("🟢 ONLINE • Supabase • ლოკალური ასლიც განახლებულია")}
async function syncOfflineQueue(){if(!sb||!navigator.onLine||syncBusy)return;syncBusy=true;try{const q=await idbQueueAll();if(!q.length){await cacheAllTables();return}setStatus("🔄 სინქრონიზაცია მიმდინარეობს...");for(const x of q){let res;if(x.action==="insert")res=await sb.from(x.table).insert(x.rows);else if(x.action==="update"){let rq=sb.from(x.table).update(x.payload);for(const f of x.filters||[])if(f.kind==="eq")rq=rq.eq(f.col,f.val);else if(f.kind==="in")rq=rq.in(f.col,f.vals);res=await rq}else if(x.action==="delete"){let rq=sb.from(x.table).delete();for(const f of x.filters||[])if(f.kind==="eq")rq=rq.eq(f.col,f.val);else if(f.kind==="in")rq=rq.in(f.col,f.vals);res=await rq}if(res?.error)throw new Error(res.error.message);await idbDeleteQueue(x.qid)}await cacheAllTables();setStatus("🟢 ONLINE • ცვლილებები სინქრონიზებულია")}catch(e){setStatus("⚠️ სინქრონიზაცია ვერ დასრულდა: "+e.message,true)}finally{syncBusy=false}}

    const idWarnings=[]; ep.forEach(x=>{const n=excelSerialKey(x.serial);if(!n)return;const dbp=people.find(p=>excelSerialKey(p.serial_no)===n);const eid=String(x.personalId||'').trim(), did=String(dbp?.personal_id||'').trim();if(dbp&&eid&&did&&eid!==did)idWarnings.push(n)});

async function restoreWrittenOffInventory(writeoffId){
  if(!db||offlineMode||!navigator.onLine){alert('აღდგენა ინტერნეტთან დაკავშირებას საჭიროებს.');return}
  const q=await db.from('inventory_writeoffs').select('*').eq('id',writeoffId).single();
  if(q.error||!q.data){alert('❌ ჩამოწერის ჩანაწერი ვერ მოიძებნა.');return}
  const wo=q.data, inv=String(wo.inventory_no||'').trim();
  if(!inv){alert('❌ საინვენტარო ნომერი არ აქვს.');return}
  let found=null;
  for(const x of inventoryTables){
    const {data,error}=await db.from(x.table).select('*').eq('inventory_no',inv).limit(1);
    if(!error&&data?.length){found={...data[0],_table:x.table,_type:x.type};break}
  }
  if(!found){alert('❌ ამ ნომრით მიმდინარე ინვენტარის ჩანაწერი ვერ მოიძებნა.');return}
  if(found.active!==false && found.person_id){alert('ℹ️ ეს ინვენტარი უკვე აქტიურია და მომხმარებელზეა მიბმული.');return}
  const formerName=String(wo.former_user||'').trim();
  const choice=prompt(`♻️ საინვენტარო № ${inv} აღდგენა\n\nჩამოწერის მიზეზი: ${wo.reason||'-'}\nყოფილი მომხმარებელი: ${formerName||'-'}\n\nშეიყვანე პიროვნების პირადი ID, ვისზეც აღდგენისთანავე მიებას.\nთუ ცარიელს დატოვებ, ინვენტარი აღდგება თავისუფალ მდგომარეობაში.` ,'');
  if(choice===null)return;
  let personId=null, personName='';
  if(choice.trim()){
    const pidq=await db.from('persons').select('id,first_name,last_name,personal_id').eq('personal_id',choice.trim()).limit(1);
    if(pidq.error||!pidq.data?.length){alert('❌ ასეთი პირადი ID-ის მქონე პიროვნება ვერ მოიძებნა.');return}
    personId=pidq.data[0].id; personName=`${pidq.data[0].first_name||''} ${pidq.data[0].last_name||''}`.trim();
    if(!confirm(`აღდგენის შემდეგ ინვენტარი მიებას:\n\n👤 ${personName}\n🪪 ID: ${choice.trim()}\n\nგავაგრძელოთ?`))return;
  }else if(!confirm(`♻️ აღვადგინოთ საინვენტარო № ${inv} თავისუფალ მდგომარეობაში?\n\nშემდეგ შეგიძლია სხვა პიროვნებაზე მიაბა.`))return;
  const up=await db.from(found._table).update({active:true,person_id:personId}).eq('id',found.id);
  if(up.error){alert('❌ ინვენტარის აღდგენა ვერ მოხერხდა: '+up.error.message);return}
  const oldComment=String(wo.comment||'').trim();
  const stamp=new Date().toLocaleString('ka-GE');
  const actor=await getCurrentUserDisplayName();
  const restoreNote=`♻️ აღდგენილია: ${stamp} • აღადგინა: ${actor}${personName?' • მიება: '+personName:' • დატოვა თავისუფალი'}`;
  const newComment=oldComment?(oldComment+'\n'+restoreNote):restoreNote;
  const wc=await db.from('inventory_writeoffs').update({comment:newComment}).eq('id',writeoffId);
  if(wc.error){
    await db.from(found._table).update({active:false,person_id:null});
    alert('❌ აღდგენის ისტორიის განახლება ვერ მოხერხდა: '+wc.error.message+'\n\nინვენტარი უსაფრთხოების მიზნით კვლავ ჩამოწერილად დარჩა.');return;
  }
  await logHistory(inv,found._table,null,personId,personId?`ჩამოწერილი ინვენტარის აღდგენა და ${personName}-ზე მიბმა`:'ჩამოწერილი ინვენტარის აღდგენა — თავისუფალ მდგომარეობაში');
  alert(personId?`✅ ინვენტარი აღდგა და მიება ${personName}-ს.`:`✅ ინვენტარი აღდგა და დარჩა თავისუფალ მდგომარეობაში.`);

async function repairProblem(type,table,id,personId,invNo){
  try{
    if(type==='unassign_unknown'){
      const ok=confirm(`ინვენტარი № ${invNo||'—'} მიბმულია ისეთ პიროვნებაზე, რომელიც პროგრამაში აღარ მოიძებნა.\n\nგსურთ პასუხისმგებლობიდან მოხსნა და ინვენტარის თავისუფლად დატოვება?`);
      if(!ok)return;
      const q=await db.from(table).select('person_id,inventory_no').eq('id',id).single();
      if(q.error)throw q.error;
      const oldPid=q.data?.person_id||personId||null;
      const u=await db.from(table).update({person_id:null,notes:inventoryNotesWithDelivery(item.notes,false)}).eq('id',id);
      if(u.error)throw u.error;
      await logHistory(q.data?.inventory_no||invNo,table,oldPid,null,'პრობლემების ცენტრიდან: უცნობ პიროვნებაზე მიბმული ინვენტარი გათავისუფლდა');
      alert('✅ ინვენტარი გათავისუფლდა.');
      await problemsView();
      return;
    }
    if(type==='unassign_inactive'){
      const ok=confirm(`ინვენტარი № ${invNo||'—'} უმოქმედო/შენახულია, მაგრამ კვლავ პიროვნებაზეა მიბმული.\n\nგსურთ პასუხისმგებლობიდან მოხსნა?`);
      if(!ok)return;
      const q=await db.from(table).select('person_id,inventory_no').eq('id',id).single();
      if(q.error)throw q.error;
      const u=await db.from(table).update({person_id:null}).eq('id',id);
      if(u.error)throw u.error;
      await logHistory(q.data?.inventory_no||invNo,table,q.data?.person_id||null,null,'პრობლემების ცენტრიდან: უმოქმედო ინვენტარი მოიხსნა პასუხისმგებლობიდან');
      alert('✅ პასუხისმგებლობა მოიხსნა.');
      await problemsView();
      return;
    }
    if(type==='open_excel_import'){
      excelView();
      setTimeout(()=>{const btn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('იმპორტის')||b.textContent.includes('იმპორტ'));if(btn)btn.scrollIntoView({behavior:'smooth',block:'center'});},80);
      return;
    }
    if(type==='edit_person'){
      const {data,error}=await db.from('persons').select('*').eq('id',personId).single();
      if(error)throw error;
      openPersonForm(data);
      return;
    }
    alert('ℹ️ ამ პრობლემას ავტომატური ცვლილება არ აქვს. გახსენი ჩანაწერი და გადაამოწმე ხელით.');
  }catch(e){alert('გამოსწორების შეცდომა: '+(e.message||e));}
}

async function problemsView(){
  section.innerHTML=`<div class="card"><div class="toolbar"><h2 style="margin-right:auto">⚠️ პრობლემების ცენტრი</h2><button class="btn btn-primary" onclick="problemsView()">🔄 ხელახლა შემოწმება</button></div><p class="hint">პროგრამა ამოწმებს მონაცემებს და აჩვენებს პრობლემებს. სადაც უსაფრთხოდ შეიძლება, გაქვს პირდაპირი <b>🔧 გამოსწორება</b>; სხვა შემთხვევებში მხოლოდ შემოწმების/რედაქტირების გზა ჩანს.</p><div id="problemsBox"><div class="status">🔄 ვამოწმებ მონაცემებს...</div></div></div>`;
  try{
    const [pr,...irs]=await Promise.all([db.from('persons').select('*'),...inventoryTables.map(x=>db.from(x.table).select('*'))]);
    if(pr.error)throw pr.error;
    const people=pr.data||[], issues=[];
    const add=(severity,title,detail,action,repair=null)=>issues.push({severity,title,detail,action,repair});
    const nkey=v=>String(v??'').trim();
    const escJs=v=>String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const pByN=new Map();
    people.forEach(p=>{const n=nkey(p.serial_no);if(n){if(pByN.has(n))add('high','ერთსა და იმავე N-ზე რამდენიმე პიროვნებაა',`N ${n} — ${pByN.get(n).first_name||''} ${pByN.get(n).last_name||''} და ${p.first_name||''} ${p.last_name||''}`,`focusProblemPerson('${escJs(n)}')`);else pByN.set(n,p)}});
    const invSeen=new Map(); const personIds=new Set(people.map(p=>p.id));
    inventoryTables.forEach((cfg,i)=>{(irs[i]?.data||[]).forEach(r=>{
      const no=nkey(r.inventory_no);
      if(!no)add('medium','საინვენტარო ნომერი ცარიელია',`${cfg.type} • ჩანაწერი ${r.id}`,`focusProblemInventory('${escJs(cfg.table)}','${escJs(r.id)}','')`,'');
      else if(invSeen.has(no)){const x=invSeen.get(no);add('high','დუბლირებული საინვენტარო ნომერი',`№ ${no} — ${x.type} და ${cfg.type}`,`focusProblemInventory('${escJs(cfg.table)}','${escJs(r.id)}','${escJs(no)}')`,'');}
      else invSeen.set(no,{type:cfg.type,table:cfg.table,id:r.id});
      if(r.person_id&&!personIds.has(r.person_id))add('high','ინვენტარი მიბმულია უცნობ პიროვნებაზე',`${cfg.type} • № ${no||'—'}`,`focusProblemInventory('${escJs(cfg.table)}','${escJs(r.id)}','${escJs(no)}')`,`repairProblem('unassign_unknown','${escJs(cfg.table)}','${escJs(r.id)}','${escJs(r.person_id)}','${escJs(no)}')`);
      if(r.active===false&&r.person_id){const pp=people.find(x=>x.id===r.person_id);add('medium','უმოქმედო ინვენტარი კვლავ პიროვნებაზეა მიბმული',`${cfg.type} • № ${no||'—'} • ${pp?(pp.first_name+' '+pp.last_name):'უცნობი პიროვნება'}`,pp?`focusProblemPerson('${escJs(pp.serial_no||'')}')`:`focusProblemInventory('${escJs(cfg.table)}','${escJs(r.id)}','${escJs(no)}')`,`repairProblem('unassign_inactive','${escJs(cfg.table)}','${escJs(r.id)}','${escJs(r.person_id)}','${escJs(no)}')`)}
    })});
    const saved=await loadExcelImport(); const ep=saved?.people||[], er=saved?.rows||[];
    ep.forEach(x=>{const n=nkey(x.serial);if(!n)return;const p=pByN.get(n);if(!p)add('medium','Excel-ში არის პიროვნება, რომელიც პროგრამაში არ არის',`N ${n} • ${x.firstName||''} ${x.lastName||''}`,`focusExcelPerson('${escJs(n)}')`,`repairProblem('open_excel_import','','','','')`);else{const eid=nkey(x.personalId),did=nkey(p.personal_id);if(eid&&did&&eid!==did)add('medium','პირადი ID განსხვავებულია',`N ${n} • Excel: ${eid} • პროგრამა: ${did}`,`focusProblemPerson('${escJs(n)}')`,`repairProblem('edit_person','','','${escJs(p.id)}','')`);}});
    const excelNCount=new Map(); ep.forEach(x=>{const n=nkey(x.serial);if(n)excelNCount.set(n,(excelNCount.get(n)||0)+1)}); excelNCount.forEach((c,n)=>{if(c>1)add('high','Excel-ში N მეორდება',`N ${n} — ${c} ჩანაწერი`,`focusExcelPerson('${escJs(n)}')`,'');
    });
    er.forEach(r=>{if(r.inventoryNo){const matches=invSeen.get(nkey(r.inventoryNo));if(!matches)add('medium','Excel-ის ინვენტარი პროგრამაში არ მოიძებნა',`№ ${r.inventoryNo} • ${r.personName||'პიროვნება უცნობია'} • ${r.sheet||''} / ${r.row||''}`,`globalSearchView();setTimeout(()=>{const el=document.getElementById('globalInv');if(el){el.value='${escJs(r.inventoryNo)}';runGlobalSearch();}},80)`,`repairProblem('open_excel_import','','','','')`);}});
    const box=document.getElementById('problemsBox');
    if(!issues.length){box.innerHTML='<div class="status" style="color:#15803d;font-weight:700;font-size:18px">✅ პრობლემა ვერ მოიძებნა — მონაცემები წესრიგშია.</div>';return}
    const order={high:0,medium:1,low:2}; issues.sort((a,b)=>order[a.severity]-order[b.severity]);
    const counts=issues.reduce((a,x)=>(a[x.severity]=(a[x.severity]||0)+1,a),{});
    box.innerHTML=`<div class="excel-summary"><div class="excel-stat"><b>${issues.length}</b> პრობლემა</div><div class="excel-stat"><b>${counts.high||0}</b> 🔴 მაღალი</div><div class="excel-stat"><b>${counts.medium||0}</b> 🟠 საშუალო</div></div><div style="display:grid;gap:10px;margin-top:14px">${issues.map(x=>{const icon=x.severity==='high'?'🔴':x.severity==='medium'?'🟠':'🟡';const cls=x.severity==='high'?'border-left:5px solid #dc2626':x.severity==='medium'?'border-left:5px solid #f59e0b':'border-left:5px solid #eab308';return `<div style="background:#fff;border:1px solid #e5e7eb;${cls};border-radius:10px;padding:13px"><div><b>${icon} ${esc(x.title)}</b></div><div style="margin-top:5px;color:#475569">${esc(x.detail)}</div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn btn-secondary" onclick="${x.action}">➡️ შემოწმება</button>${x.repair?`<button type="button" class="btn btn-warning" onclick="${x.repair}">🔧 გამოსწორება</button>`:''}</div></div>`}).join('')}</div>`;
  }catch(e){document.getElementById('problemsBox').innerHTML='<div class="status" style="color:#dc2626">შეცდომა: '+esc(e.message||e)+'</div>';}
}

async function loadPersonDocuments(pid){
  const box=document.getElementById('personDocs_'+String(pid).replace(/[^a-zA-Z0-9_-]/g,''));
  if(!box)return;
  try{
    const q=await db.from('person_documents').select('*').eq('person_id',pid).order('created_at',{ascending:false});
    if(q.error){box.innerHTML='<div class="hint">ℹ️ დოკუმენტების ცალკე მოდული ამ V20 ბაზაში ჯერ არ არის დაკავშირებული. დანარჩენი დოსიეს ფუნქციები სრულად მუშაობს.</div>';return}
    const docs=q.data||[];
    if(!docs.length){box.innerHTML='<div class="status">ამ პიროვნებაზე ატვირთული დოკუმენტი ჯერ არ არის.</div>';return}
    box.innerHTML='<div class="table-wrap"><table><thead><tr><th>დოკუმენტი</th><th>ტიპი</th><th>თარიღი</th><th>მოქმედება</th></tr></thead><tbody>'+docs.map(d=>`<tr><td>${esc(d.file_name||d.name||'დოკუმენტი')}</td><td>${esc(d.file_type||'—')}</td><td>${esc(d.created_at?new Date(d.created_at).toLocaleString('ka-GE'):'—')}</td><td>${d.file_url?`<button class="btn btn-secondary" onclick="window.open('${escJs(d.file_url)}','_blank')">📂 გახსნა</button><a class="btn btn-primary" href="${esc(d.file_url)}" target="_blank" download>⬇️ ჩამოტვირთვა</a>`:'—'}</td></tr>`).join('')+'</tbody></table></div>';
  }catch(err){box.innerHTML='<div class="status" style="color:#b91c1c">დოკუმენტების ჩატვირთვის შეცდომა: '+esc(err.message||err)+'</div>'}
}

async function personsView(){section.innerHTML=`<div class="card"><div class="toolbar"><h2 style="margin-right:auto">👤 პიროვნებები</h2><input class="search" id="personSearch" placeholder="🔎 პიროვნება: სახელი, გვარი, ID, კაბინეტი..." oninput="filterPersons()"><button class="btn btn-primary" onclick="openPersonForm()">➕ ახალი პიროვნების დამატება</button></div><div class="card" style="margin:12px 0;padding:14px;background:#f8fbff;border:2px solid #bfdbfe"><div style="font-weight:700;margin-bottom:7px">📦 საინვენტარო ნომრით ძებნა</div><input class="search" id="personInventorySearch" style="max-width:520px;width:100%" placeholder="მაგ. 12345 — ჩაწერე საინვენტარო №" oninput="filterPersonInventory()"><div id="personInventorySearchStatus" class="hint" style="margin-top:8px"></div></div><div class="table-wrap"><table><thead><tr><th>ფოტო</th><th>რიგითი №</th><th>სახელი / გვარი</th><th>პირადი ID</th><th>თანამდებობა</th><th>კონტაქტები</th><th>კაბინეტი</th><th>სართული</th><th>ინვენტარი</th><th>მოქმედება</th></tr></thead><tbody id="personBody"></tbody></table></div></div>`;setStatus('⚡ პიროვნებები იტვირთება...');let data=fastCache.persons;if(!data || Date.now()-fastCache.personsAt>60000){const q=await db.from('persons').select('*').order('created_at',{ascending:false});if(q.error){setStatus('შეცდომა: '+q.error.message,true);return}data=q.data||[];fastCache.persons=data;fastCache.personsAt=Date.now()}window.personRows=data||[];await renderPersons();setStatus('დაკავშირებულია • '+window.personRows.length+' პიროვნება')}
async function renderPersons(){const b=document.getElementById('personBody');let counts=fastCache.counts;if(!counts || Date.now()-fastCache.countsAt>30000){counts={};await Promise.all(inventoryTables.map(async x=>{const {data}=await db.from(x.table).select('person_id').not('person_id','is',null);for(const r of (data||[])){if(r.person_id)counts[r.person_id]=(counts[r.person_id]||0)+1}}));fastCache.counts=counts;fastCache.countsAt=Date.now()}if(!fastCache.personInventoryNos || Date.now()-fastCache.personInventoryNosAt>30000){const invMap={};await Promise.all(inventoryTables.map(async x=>{const {data}=await db.from(x.table).select('person_id,inventory_no');for(const r of (data||[])){if(r.person_id && r.inventory_no!=null){const k=String(r.person_id);(invMap[k]||(invMap[k]=[])).push(String(r.inventory_no).toLowerCase())}}}));fastCache.personInventoryNos=invMap;fastCache.personInventoryNosAt=Date.now()}b.innerHTML=window.personRows.map(p=>{const cs=parseContacts(p.mobile);const invs=(fastCache.personInventoryNos[String(p.id)]||[]).join(' ');return `<tr data-search="${esc([p.serial_no,p.first_name,p.last_name,p.personal_id,p.position,p.room_no,p.floor,p.mobile].join(' ').toLowerCase())}" data-invsearch="${esc(invs)}"><td>${p.photo_url?`<img class="person-photo" src="${esc(p.photo_url)}" alt="ფოტო">`:`<div class="person-photo" style="display:flex;align-items:center;justify-content:center;font-size:28px">👤</div>`}</td><td><b>${esc(p.serial_no??'')}</b></td><td><b class="${p.employed===false?'person-left':''}">${esc(p.first_name)} ${esc(p.last_name)}</b>${p.employed===false?'<br><span style="color:#dc2626;font-weight:700">🔴 აღარ მუშაობს</span>':''}<br><span class="badge">ID: ${esc(p.id)}</span></td><td>${esc(p.personal_id)}</td><td>${esc(p.position)}</td><td>${cs.map(esc).join('<br>')}</td><td>${esc(p.room_no)}</td><td>${esc(p.floor)}</td><td><b>${counts[p.id]||0}</b> ობიექტი</td><td class="actions"><button class="btn-success" onclick="personInventory('${p.id}')">📦 ინვენტარი</button><button class="btn-secondary" onclick="editPerson('${p.id}')">✏️</button><button class="btn-danger" onclick="deletePerson('${p.id}')">🗑️</button><button class="btn-warning" onclick="printPerson('${p.id}')">🖨️</button><button class="btn-primary" onclick="printAct('${p.id}')">📄 აქტი</button></td></tr>`}).join('')}
function filterPersons(){const q=(personSearch.value||'').toLowerCase();document.querySelectorAll('#personBody tr').forEach(r=>r.style.display=r.dataset.search.includes(q)&&((document.getElementById('personInventorySearch')?.value||'').trim().toLowerCase()===''||r.dataset.invsearch.includes((document.getElementById('personInventorySearch')?.value||'').trim().toLowerCase()))?'':'none')}
function filterPersonInventory(){const q=(document.getElementById('personInventorySearch')?.value||'').trim().toLowerCase();const s=document.getElementById('personInventorySearchStatus');if(s)s.textContent=q?'📦 საინვენტარო №-ით იძებნება...':'';document.querySelectorAll('#personBody tr').forEach(r=>r.style.display=r.dataset.search.includes((document.getElementById('personSearch')?.value||'').trim().toLowerCase())&&(!q||r.dataset.invsearch.includes(q))?'':'none');if(s){const n=[...document.querySelectorAll('#personBody tr')].filter(r=>r.style.display!=='none').length;s.textContent=q?`📦 ნაპოვნია ${n} პიროვნება საინვენტარო №-ით: ${q}`:''}}
function parseContacts(v){return String(v||'').split(/\s*(?:\/|;|\n|,|\|)\s*/).map(x=>x.trim()).filter(Boolean).slice(0,4)}
function roomParts(v){const m=String(v||'').match(/^([A-E])\s*[-№ ]?\s*(.*)$/i);return m?{cab:m[1].toUpperCase(),num:m[2]||''}:{cab:'',num:v||''}}
function openPersonForm(row={}){editingId=row.id||null;currentPerson=row.id?row:null;modalTitle.textContent=editingId?'✏️ პიროვნების შესწორება':'➕ ახალი პიროვნების დამატება';const rp=roomParts(row.room_no);const cs=parseContacts(row.mobile);recordForm.innerHTML=`<div class="grid"><div class="field full" style="border:1px solid #c7d2fe;border-radius:10px;padding:12px;background:#eef2ff"><label>📷 პიროვნების ფოტო</label><div class="photo-preview"><div id="personPhotoPreview">${row.photo_url?`<img src="${esc(row.photo_url)}" alt="პიროვნების ფოტო">`:`<div class="person-photo" style="display:flex;align-items:center;justify-content:center;font-size:42px">👤</div>`}</div><div><div class="photo-actions"><label class="btn btn-primary" style="display:inline-block;cursor:pointer">📷 ფოტოს გადაღება<input id="p_photo_camera" type="file" accept="image/*" capture="user" style="display:none" onchange="previewPersonPhoto(this)"></label><label class="btn btn-secondary" style="display:inline-block;cursor:pointer">🖼️ ფოტოს არჩევა<input id="p_photo_file" type="file" accept="image/*" style="display:none" onchange="previewPersonPhoto(this)"></label>${row.photo_url?`<button class="btn btn-danger" type="button" onclick="removePersonPhoto('${editingId}')">🗑️ ფოტოს წაშლა</button>`:''}</div><div class="hint">მობილურზე კამერა ავტომატურად გაიხსნება. ფოტო ავტომატურად დაპატარავდება მაქსიმუმ 600×600 px-მდე.</div></div></div></div><div class="field"><label>რიგითი უნიკალური №</label><input id="p_serial" type="number" min="1" value="${esc(row.serial_no)}" onblur="checkPersonSerial(this.value,'${editingId||''}')"><div id="p_serial_status" class="hint"></div></div><div class="field"><label>სახელი *</label><input id="p_first" required value="${esc(row.first_name)}"></div><div class="field"><label>გვარი *</label><input id="p_last" required value="${esc(row.last_name)}"></div><div class="field"><label>პირადი ID</label><input id="p_pid" value="${esc(row.personal_id)}"></div><div class="field"><label>თანამდებობა</label><input id="p_pos" value="${esc(row.position)}"></div><div class="field"><label><input id="p_employed" type="checkbox" style="width:auto" ${row.employed!==false?"checked":""}> მუშაობს</label><div class="hint">მოხსნის შემთხვევაში სახელი და გვარი წითლად გამოჩნდება.</div></div><div class="field"><label>სართული</label><input id="p_floor" type="number" value="${esc(row.floor)}"></div><div class="field"><label>კაბინეტი</label><select id="p_cab"><option value="">აირჩიე</option>${['A','B','C','D','E'].map(x=>`<option ${rp.cab===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>კაბინეტის ნომერი</label><input id="p_room" value="${esc(rp.num)}"></div><div class="field"><label>სამსახურის შიდა ნომერი</label><input id="p_work" value="${esc(row.work_phone)}"></div><div class="field full"><label>საკონტაქტო ნომრები — მაქსიმუმ 4</label><div class="contact-grid">${[0,1,2,3].map(i=>`<input id="p_c${i}" type="tel" placeholder="+995..." value="${esc(cs[i]||'')}">`).join('')}</div><div class="hint">შეგიძლია მიუთითო 1, 2, 3 ან 4 ნომერი.</div></div><div class="field"><label>IP Address</label><input id="p_ip" value="${esc(row.ip_address)}"></div><div class="field"><label>MAC Address</label><input id="p_mac" value="${esc(row.mac_address)}"></div><div class="field full"><label>შენიშვნა</label><textarea id="p_notes">${esc(row.notes)}</textarea></div>${!editingId?`<div class="field full" style="border:1px solid #dbeafe;border-radius:10px;padding:12px;background:#f8fbff"><label>📦 საინვენტარო ნომერი</label><div class="grid" style="margin-top:8px"><div class="field"><label>ინვენტარის ტიპი *</label><select id="p_inventory_type" onchange="checkNewPersonInventory()"><option value="">აირჩიე...</option>${inventoryTables.map(x=>`<option value="${x.table}">${esc(x.type)}</option>`).join('')}</select></div><div class="field"><label>საინვენტარო №</label><div style="display:flex;gap:8px"><input id="p_inventory_no" placeholder="შეიყვანე საინვენტარო ნომერი" style="flex:1"><button class="btn btn-secondary" type="button" onclick="checkNewPersonInventory()">🔎 შემოწმება</button></div></div></div><div id="p_inventory_status" class="hint">აირჩიე ტიპი და შეიყვანე ნომერი. არსებული ნომერი მიებმება; თუ არ არსებობს, შეიქმნება ახალი ინვენტარი.</div></div>`:`<div class="field full" style="border:1px solid #bbf7d0;border-radius:10px;padding:12px;background:#f0fdf4"><label>📦 საინვენტარო დამატება / პასუხისმგებლობაზე მიბმა</label><div class="grid" style="margin-top:8px"><div class="field"><label>ინვენტარის ტიპი *</label><select id="directInvType" onchange="prepareDirectInventory()"><option value="">აირჩიე...</option>${inventoryTables.map(x=>`<option value="${x.table}">${esc(x.type)}</option>`).join('')}</select></div><div class="field"><label>საინვენტარო № *</label><input id="directInvNo" placeholder="მაგ. 12345" oninput="clearDirectInventoryStatus()" onblur="checkDirectInventory()"></div><div class="field full"><div id="directInvStatus" class="hint">აირჩიე ტიპი და ჩაწერე საინვენტარო ნომერი.</div></div></div><button class="btn btn-success" type="button" onclick="assignDirectInventory('${editingId}')">🔗 ინვენტარის დამატება ამ პიროვნებაზე</button><div class="hint">თუ ნომერი დაკავებულია, სისტემა გაჩვენებს ამჟამინდელ პასუხისმგებელ პირს და გადაცემამდე მოგთხოვს დადასტურებას.</div></div>`}</div><br><button class="btn btn-primary" type="submit">💾 შენახვა</button> <button class="btn btn-secondary" type="button" onclick="closeModal()">გაუქმება</button>`;recordForm.onsubmit=savePerson;modal.classList.add('show')}
async function findInventoryByNumber(inv){inv=String(inv||'').trim();if(!inv)return {items:[],error:null};const items=[];for(const x of inventoryTables){const {data,error}=await db.from(x.table).select('*').eq('inventory_no',inv);if(error)return {items:[],error};for(const r of (data||[]))items.push({...r,_table:x.table,_type:x.type,_key:x.key,_name:r[x.nameField]||r.model||''});}return {items,error:null}}
async function checkNewPersonInventory(){const type=document.getElementById('p_inventory_type')?.value;const inv=document.getElementById('p_inventory_no')?.value.trim();const s=document.getElementById('p_inventory_status');if(!s)return;if(!type){s.innerHTML='<span style="color:#b91c1c">❌ აირჩიე ინვენტარის ტიპი.</span>';return}if(!inv){s.textContent='შეიყვანე საინვენტარო ნომერი.';return}s.innerHTML='🔎 მოწმდება...';const {data:wo}=await db.from('inventory_writeoffs').select('*').eq('inventory_no',inv).order('writeoff_date',{ascending:false}).limit(1);const {data,error}=await db.from(type).select('*').eq('inventory_no',inv);if(error){s.innerHTML='<span style="color:#b91c1c">შემოწმების შეცდომა: '+esc(error.message)+'</span>';return}if(!data?.length){s.innerHTML=`<span style="color:#15803d">🟢 ამ კატეგორიაში ნომერი არ არსებობს — შენახვისას შეიქმნება ახალი ინვენტარი.${wo?.length?' <br><span style="color:#b91c1c">📕 ეს ნომერი ჩამოწერის ისტორიაშიც ფიქსირდება, მაგრამ მისი გამოყენება დასაშვებია.</span>':''}</span>`;return}if(data.length>1){s.innerHTML='<span style="color:#b45309">⚠️ ამ კატეგორიაში ნომერი ერთზე მეტ ჩანაწერშია.</span>';return}const r=data[0];if(!r.person_id)s.innerHTML='<span style="color:#15803d">🟢 არსებული ინვენტარი თავისუფალია — ახალ პიროვნებაზე მიებას.</span>'+(wo?.length?'<br><span style="color:#b91c1c">📕 ნომერი ჩამოწერის ისტორიაშიც ფიქსირდება.</span>':'');else{const {data:p}=await db.from('persons').select('first_name,last_name').eq('id',r.person_id).single();s.innerHTML=`<span style="color:#b45309">🟠 უკვე დაკავებულია — ${esc(p?`${p.first_name||''} ${p.last_name||''}`.trim():'სხვა მომხმარებელი')}. შენახვისას მოგეთხოვება გადაბარების დადასტურება.</span>`+(wo?.length?'<br><span style="color:#b91c1c">📕 ნომერი ჩამოწერის ისტორიაშიც ფიქსირდება.</span>':'')}}
async function transferInventoryToPerson(inv,newPid,type){
 const st=await db.from('inventory_writeoffs').select('*').eq('inventory_no',inv).order('writeoff_date',{ascending:false}).limit(1);
 const wo=st.data?.[0]||null;
 let items=[];
 if(type){const q=await db.from(type).select('*').eq('inventory_no',inv);if(q.error)throw new Error(q.error.message);items=q.data||[];}
 else {const res=await findInventoryByNumber(inv);if(res.error)throw new Error(res.error.message);items=res.items;}
 if(items.length>1)throw new Error('საინვენტარო ნომერი ერთზე მეტ ჩანაწერშია გამოყენებული.');
 if(!items.length){
   if(!type)throw new Error('ინვენტარის ტიპი უნდა აირჩიოთ, რადგან ეს ნომერი სისტემაში ჯერ არ არსებობს.');
   const cfg=Object.values(configs).find(c=>c.table===type);const typeLabel=inventoryTables.find(x=>x.table===type)?.type||type;const payload={inventory_no:inv,person_id:newPid,notes:DELIVERY_PENDING_MARKER};
   const nameField=cfg?.fields.find(f=>f[0]==='name');
   if(nameField){const name=prompt(`შეიყვანე ახალი ინვენტარის დასახელება (${typeLabel}):`,'');if(name===null)throw new Error('შექმნა გაუქმებულია.');if(!name.trim())throw new Error('ინვენტარის დასახელება აუცილებელია.');payload.name=name.trim();}
   if(type==='internal_drives'||type==='external_drives'){const d=prompt('მიუთითე დისკის ტიპი: HDD ან SSD','HDD');if(d===null)throw new Error('შექმნა გაუქმებულია.');const dt=d.trim().toUpperCase();if(!['HDD','SSD'].includes(dt))throw new Error('დისკის ტიპი უნდა იყოს HDD ან SSD.');payload.drive_type=dt;}
   const cr=await db.from(type).insert(payload).select('*').single();if(cr.error)throw new Error('ახალი ინვენტარის შექმნა ვერ მოხერხდა: '+cr.error.message);
   await logHistory(inv,type,null,newPid,wo?'ჩამოწერილი ნომერი ხელახლა შემოვიდა და მიება ახალ პიროვნებას':'ახალი ინვენტარის შემოსვლა და პიროვნებაზე მიბმა');
   return {ok:true,created:true,writeoff:!!wo};
 }
 const r=items[0];const fromPid=r.person_id||null;
 if(fromPid&&String(fromPid)===String(newPid))return {ok:true,fromPid,writeoff:!!wo};
 if(fromPid){const {data:p}=await db.from('persons').select('first_name,last_name').eq('id',fromPid).single();const owner=p?`${p.first_name||''} ${p.last_name||''}`.trim():'სხვა მომხმარებელი';const ok=confirm(`საინვენტარო ნომერი ${inv} უკვე დაკავებულია.\n\nპასუხისმგებელი პირი: ${owner}\n${wo?'\n🔴 ეს ნომერი ასევე ფიქსირდება ჩამოწერის ისტორიაში.':''}\n\nგსურთ ძველი მომხმარებლისგან მოვხსნათ პასუხისმგებლობა და გადავაბაროთ ახალ პიროვნებას?`);if(!ok)return {ok:false,cancelled:true,fromPid,writeoff:!!wo};const oldErr=await db.from(r._table).update({person_id:null}).eq('id',r.id);if(oldErr.error)throw new Error('ძველი მომხმარებლისგან განთავისუფლება ვერ მოხერხდა: '+oldErr.error.message);}
 const ne=await db.from(r._table).update({person_id:newPid}).eq('id',r.id);if(ne.error)throw new Error('საინვენტარო ნომრის ახალ პიროვნებაზე მიბმა ვერ მოხერხდა: '+ne.error.message);
 await logHistory(inv,r._table,fromPid,newPid,wo?'ჩამოწერილი ნომერი ხელახლა მიება პიროვნებას':(fromPid?'პასუხისმგებლობა გადატანილია ახალი პიროვნების დამატებისას':'არსებული თავისუფალი ინვენტარი მიება პიროვნებას'));
 return {ok:true,fromPid,writeoff:!!wo};
}
async function compressPersonPhoto(file){return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=600;const scale=Math.min(1,max/Math.max(img.width,img.height));const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);c.toBlob(b=>b?resolve(b):reject(new Error('ფოტოს დამუშავება ვერ მოხერხდა.')),'image/jpeg',0.78)};img.onerror=()=>reject(new Error('ფოტოს წაკითხვა ვერ მოხერხდა.'));img.src=reader.result};reader.onerror=()=>reject(new Error('ფაილის წაკითხვა ვერ მოხერხდა.'));reader.readAsDataURL(file)})}
function previewPersonPhoto(input){const file=input?.files?.[0];if(!file)return;const other=input.id==='p_photo_camera'?document.getElementById('p_photo_file'):document.getElementById('p_photo_camera');if(other)other.value='';const reader=new FileReader();reader.onload=()=>{const box=document.getElementById('personPhotoPreview');if(box)box.innerHTML=`<img src="${reader.result}" alt="ახალი ფოტო">`};reader.readAsDataURL(file)}
async function uploadPersonPhoto(personId,file){if(!sb||offlineMode||!navigator.onLine)throw new Error('ფოტოს ღრუბელში ატვირთვა ინტერნეტთან კავშირს საჭიროებს.');const blob=await compressPersonPhoto(file);const path=`${personId}/${Date.now()}.jpg`;const up=await sb.storage.from('person-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(up.error)throw new Error('Storage: '+up.error.message);const pub=sb.storage.from('person-photos').getPublicUrl(path);if(!pub.data?.publicUrl)throw new Error('ფოტოს მისამართი ვერ შეიქმნა.');return pub.data.publicUrl}
async function removePersonPhoto(personId){if(!confirm('წავშალოთ ამ პიროვნების ფოტო?'))return;const upd=await db.from('persons').update({photo_url:null}).eq('id',personId);if(upd.error){alert('ფოტოს წაშლა ვერ მოხერხდა: '+upd.error.message);return}clearFastCache();await personsView()}
async function savePerson(e){e.preventDefault();const contacts=[0,1,2,3].map(i=>document.getElementById('p_c'+i).value.trim()).filter(Boolean);const cab=document.getElementById('p_cab').value;const room=document.getElementById('p_room').value.trim();const inventoryNo=!editingId?(document.getElementById('p_inventory_no')?.value.trim()||''):'';const inventoryType=!editingId?(document.getElementById('p_inventory_type')?.value||''):'';const serialRaw=document.getElementById('p_serial')?.value.trim();if(!serialRaw||!/^\d+$/.test(serialRaw)||Number(serialRaw)<1){alert('შეიყვანე დადებითი მთელი რიგითი ნომერი.');return}const serialNo=Number(serialRaw);const sq=await db.from('persons').select('id').eq('serial_no',serialNo).limit(1);if(sq.error){alert('რიგითი ნომრის შემოწმების შეცდომა: '+sq.error.message);return}if(sq.data?.length&&sq.data[0].id!==editingId){alert('⚠️ რიგითი № '+serialNo+' უკვე მინიჭებულია სხვა პიროვნებაზე. მიუთითე სხვა ნომერი.');return}const payload={serial_no:serialNo,first_name:p_first.value.trim(),last_name:p_last.value.trim(),personal_id:p_pid.value.trim()||null,position:p_pos.value.trim()||null,room_no:(cab?(cab+(room?' '+room:'')):room)||null,floor:p_floor.value?Number(p_floor.value):null,mobile:contacts.join(' / ')||null,work_phone:p_work.value.trim()||null,ip_address:p_ip.value.trim()||null,mac_address:p_mac.value.trim()||null,notes:p_notes.value.trim()||null,employed:document.getElementById('p_employed')?.checked!==false};
 let result=editingId?await db.from('persons').update(payload).eq('id',editingId).select().single():await db.from('persons').insert(payload).select().single();
 if(result.error){alert('პიროვნების შენახვის შეცდომა: '+result.error.message);return}
 const photoInput=document.getElementById('p_photo_camera')?.files?.[0]||document.getElementById('p_photo_file')?.files?.[0]||null;
 if(photoInput){try{const photoUrl=await uploadPersonPhoto(result.data.id,photoInput);const pu=await db.from('persons').update({photo_url:photoUrl}).eq('id',result.data.id).select().single();if(pu.error)throw new Error(pu.error.message);}catch(err){alert('პიროვნება შეინახა, მაგრამ ფოტოს ატვირთვა ვერ მოხერხდა:\n'+err.message);}}
 if(!editingId&&inventoryNo){
   if(!inventoryType){alert('პიროვნება დაემატა, მაგრამ საინვენტარო ტიპი არ აგირჩევია.');closeModal();await personsView();return}

async function checkPersonSerial(){const el=document.getElementById('p_serial_status');const inp=document.getElementById('p_serial');if(!el||!inp)return;const raw=inp.value.trim();if(!raw){el.innerHTML='<span style="color:#b91c1c">❌ მიუთითე რიგითი ნომერი.</span>';return}const n=Number(raw);if(!Number.isInteger(n)||n<1){el.innerHTML='<span style="color:#b91c1c">❌ რიგითი ნომერი უნდა იყოს დადებითი მთელი რიცხვი.</span>';return}const {data,error}=await db.from('persons').select('id,first_name,last_name').eq('serial_no',n).limit(1);if(error){el.innerHTML='<span style="color:#b91c1c">შემოწმების შეცდომა: '+esc(error.message)+'</span>';return}if(data?.length&&data[0].id!==editingId){el.innerHTML=`<span style="color:#b91c1c">🔴 რიგითი № ${n} დაკავებულია — ${esc(`${data[0].first_name||''} ${data[0].last_name||''}`.trim())}. მიუთითე სხვა ნომერი.</span>`}else el.innerHTML=`<span style="color:#15803d">🟢 რიგითი № ${n} თავისუფალია.</span>`}

async function countPersonInventory(pid){let n=0;for(const x of inventoryTables){const {data}=await db.from(x.table).select('id').eq('person_id',pid);n+=(data||[]).length}return n}
const DELIVERY_PENDING_MARKER='[DELIVERY_PENDING]';
function inventoryNoteClean(v){return String(v||'').replace(/(^|\n)\[DELIVERY_PENDING\](?=\n|$)/g,'').replace(/^\n+|\n+$/g,'').trim()}
function inventoryHasPendingDelivery(row){return String(row?.notes||'').includes(DELIVERY_PENDING_MARKER)}
function inventoryNotesWithDelivery(notes,pending){const clean=inventoryNoteClean(notes);return pending?(clean?DELIVERY_PENDING_MARKER+'\n'+clean:DELIVERY_PENDING_MARKER):clean}
async function setInventoryDeliveryStatus(table,id,pending){const q=await db.from(table).select('notes,inventory_no').eq('id',id).single();if(q.error||!q.data){alert('ინვენტარის მოძიება ვერ მოხერხდა: '+(q.error?.message||'ჩანაწერი ვერ მოიძებნა'));return false}const u=await db.from(table).update({notes:inventoryNotesWithDelivery(q.data.notes,pending)}).eq('id',id);if(u.error){alert('სტატუსის შეცვლა ვერ მოხერხდა: '+u.error.message);return false}return true}
async function markInventoryReceived(table,id,pid){if(!confirm('დადასტურებულია, რომ ეს ინვენტარი უკვე მივიდა მომხმარებელთან?\n\nსტატუსი გახდება: 🟢 მოქმედებაშია'))return;if(await setInventoryDeliveryStatus(table,id,false)){alert('✅ მომხმარებელმა ინვენტარი მიიღო.\nსტატუსი: 🟢 მოქმედებაშია');await personInventory(pid)}}
async function markInventoryNotReceived(table,id,pid){if(!confirm('მოვნიშნოთ, რომ ინვენტარი მომზადებულია/გაცემულია, მაგრამ მომხმარებელთან ჯერ არ მისულა?'))return;if(await setInventoryDeliveryStatus(table,id,true)){alert('📦⚠️ მონიშნულია: მომხმარებელთან ჯერ არ მისულა.');await personInventory(pid)}}

async function reportPersonInventoryProblem(table,id,pid){
  if(!db||offlineMode||!navigator.onLine){alert('პრობლემის დაფიქსირება ინტერნეტთან დაკავშირებას საჭიროებს.');return}
  const row=(await db.from(table).select('*').eq('id',id).single()).data;
  if(!row){alert('ინვენტარი ვერ მოიძებნა.');return}
  const cfg=inventoryTables.find(x=>x.table===table);
  const text=prompt('აღწერე პრობლემა / შემოწმების შედეგი:', '');
  if(text===null)return;
  if(!text.trim()){alert('პრობლემის აღწერა აუცილებელია.');return}
  const reporterName=await getCurrentUserDisplayName();
  const reporterEmail=currentAuthUser?.email||'';
  const reporterLabel=reporterEmail && reporterName!==reporterEmail ? `${reporterName} (${reporterEmail})` : reporterName;
  const {error}=await db.from('inventory_problems').insert({
    inventory_no:String(row.inventory_no||'').trim(),
    inventory_type:cfg?.type||null,
    person_id:pid,
    reported_by:currentAuthUser?.id||null,
    reported_by_email:reporterLabel,
    problem_text:text.trim(),
    status:'open'
  });
  if(error){alert('პრობლემის დაფიქსირება ვერ მოხერხდა:\n'+error.message);return}
  alert('⚠️ პრობლემა დაფიქსირდა და ავტომატურად დაემატა პრობლემურ ინვენტარებში.\n\nინვენტარი კვლავ ამ მომხმარებელზე რჩება.');
  await personInventory(pid);
}

async function personInventory(pid){const {data:p,error}=await db.from('persons').select('*').eq('id',pid).single();if(error){alert(error.message);return}currentPerson=p;modalTitle.textContent='📦 '+p.first_name+' '+p.last_name+' — ინვენტარი';let all=[];for(const x of inventoryTables){const {data}=await db.from(x.table).select('*').eq('person_id',pid);for(const r of (data||[]))all.push({...r,_type:x.type,_table:x.table,_key:x.key,_name:r[x.nameField]||r.model||''})}recordForm.onsubmit=e=>e.preventDefault();recordForm.innerHTML=`<div class="person-box"><b>პასუხისმგებელი:</b> ${esc(p.first_name)} ${esc(p.last_name)}<br><b>თანამდებობა:</b> ${esc(p.position||'')}<br><b>კაბინეტი:</b> ${esc(p.room_no||'')} • <b>სართული:</b> ${esc(p.floor||'')}</div><div class="card" style="margin:12px 0;padding:14px;background:#f8fbff;border:1px solid #dbeafe"><h3 style="margin-top:0">➕ არსებული ინვენტარის ამ პიროვნებაზე დაწერა</h3><div class="grid"><div class="field"><label>1. აირჩიე ინვენტარის ტიპი *</label><select id="directInvType" onchange="prepareDirectInventory()"><option value="">აირჩიე...</option>${inventoryTables.map(x=>`<option value="${x.table}">${esc(x.type)}</option>`).join('')}</select></div><div class="field"><label>2. ჩაწერე საინვენტარო ნომერი *</label><input id="directInvNo" placeholder="მაგ. 12345" oninput="clearDirectInventoryStatus()" onblur="checkDirectInventory()"></div><div class="field full"><div id="directInvStatus" class="hint">ჯერ აირჩიე ინვენტარის ტიპი და ჩაწერე საინვენტარო ნომერი.</div></div></div><button class="btn btn-success" type="button" onclick="assignDirectInventory('${pid}')">🔗 დაწერა ამ პიროვნებაზე</button></div><div class="toolbar"><h3 style="margin-right:auto">მიბმული ინვენტარი (${all.length})</h3><button class="btn btn-warning" type="button" onclick="printPerson('${pid}')">🖨️ ბეჭდვა</button><button class="btn btn-primary" type="button" onclick="printAct('${pid}')">📄 მიღება-ჩაბარების აქტი</button></div><div class="hint" style="margin:0 0 10px">🟢 მომხმარებელთან მიღებულია • 📦⚠️ მომზადებულია/გაცემულია, მაგრამ ჯერ არ მისულა მომხმარებელთან • 🔴 უმოქმედო</div><div class="table-wrap"><table><thead><tr><th>ტიპი</th><th>საინვენტარო №</th><th>ობიექტი</th><th>სტატუსი</th><th>მოქმედება</th></tr></thead><tbody>${all.map(r=>{const pending=inventoryHasPendingDelivery(r);const status=r.active===false?'🔴 უმოქმედო':pending?'📦⚠️ მომხმარებელთან ჯერ არ მისულა':'🟢 მოქმედებაშია';const action=pending?`<button class="btn btn-success" onclick="markInventoryReceived('${r._table}','${r.id}','${pid}')">✅ მომხმარებელმა მიიღო</button>`:`<button class="btn btn-warning" onclick="markInventoryNotReceived('${r._table}','${r.id}','${pid}')">📦⚠️ ჯერ არ მისულა</button>`;return `<tr><td>${esc(r._type)}</td><td><b>${esc(r.inventory_no)}</b></td><td>${esc(r._name)}</td><td><b>${status}</b></td><td>${action} <button class="btn btn-danger" onclick="reportPersonInventoryProblem('${r._table}','${r.id}','${pid}')">⚠️ პრობლემის დაფიქსირება</button> <button class="btn-secondary" onclick="removeResponsibility('${r._table}','${r.id}','${pid}','${esc(r.inventory_no)}')">↩️ პასუხისმგებლობის მოხსნა</button> <button class="btn-danger" onclick="openWriteoffForInventory('${r._table}','${r.id}')">📕 ჩამოწერა</button></td></tr>`}).join('')}</tbody></table></div><br><button class="btn btn-secondary" type="button" onclick="closeModal()">დახურვა</button>`;modal.classList.add('show')}

function prepareDirectInventory(){const t=document.getElementById('directInvType');const s=document.getElementById('directInvStatus');const no=document.getElementById('directInvNo');if(!t||!s||!no)return;if(!t.value){s.textContent='ჯერ აირჩიე ინვენტარის ტიპი.';return}s.textContent='ახლა ჩაწერე ამ ტიპის საინვენტარო ნომერი და სისტემა შეამოწმებს მის მდგომარეობას.';no.focus()}

async function checkDirectInventory(){const type=document.getElementById('directInvType')?.value;const inv=document.getElementById('directInvNo')?.value.trim();const s=document.getElementById('directInvStatus');if(!s)return;if(!type){s.innerHTML='<span style="color:#b91c1c">❌ ჯერ აირჩიე ინვენტარის ტიპი.</span>';return}if(!inv){s.textContent='ჩაწერე საინვენტარო ნომერი.';return}s.innerHTML='🔎 მოწმდება...';const {data:wo}=await db.from('inventory_writeoffs').select('*').eq('inventory_no',inv).order('writeoff_date',{ascending:false}).limit(1);const {data,error}=await db.from(type).select('*').eq('inventory_no',inv);if(error){s.innerHTML='<span style="color:#b91c1c">შემოწმების შეცდომა: '+esc(error.message)+'</span>';return}if(!data?.length){s.innerHTML=`<span style="color:#15803d">🟢 ამ კატეგორიაში ნომერი არ არსებობს — <b>შეიძლება ახალი ინვენტარის შექმნა და ამ პიროვნებაზე მიბმა.</b>${wo?.length?' <br>📕 ნომერი ჩამოწერის ისტორიაშიც ფიქსირდება.':''}</span>`;return}if(data.length>1){s.innerHTML='<span style="color:#b45309">⚠️ ეს საინვენტარო ნომერი ამ კატეგორიაში ერთზე მეტ ჩანაწერშია.</span>';return}const r=data[0];const hist=wo?.length?`<br><span style="color:#b91c1c">📕 ჩამოწერის ისტორიაში ფიქსირდება: ${esc(wo[0].writeoff_date||'')} — ${esc(wo[0].reason||'')}</span>`:'';if(!r.person_id){s.innerHTML='<span style="color:#15803d">🟢 არსებული ინვენტარი თავისუფალია — შეიძლება ამ პიროვნებაზე დაწერა.</span>'+hist}else{const {data:p}=await db.from('persons').select('first_name,last_name,personal_id').eq('id',r.person_id).single();const owner=p?`${p.first_name||''} ${p.last_name||''}`.trim():'უცნობი მომხმარებელი';s.innerHTML=`<span style="color:#b45309">🟠 დაკავებულია — მომხმარებელი: <b>${esc(owner)}</b>${p?.personal_id?' • ID: '+esc(p.personal_id):''}. დადასტურებისას ძველი მომხმარებელი გათავისუფლდება.</span>${hist}`}}
async function assignDirectInventory(newPid){const type=document.getElementById('directInvType')?.value;const inv=document.getElementById('directInvNo')?.value.trim();if(!type){alert('ჯერ აირჩიე ინვენტარის ტიპი.');return}if(!inv){alert('ჩაწერე საინვენტარო ნომერი.');return}const {data:wo}=await db.from('inventory_writeoffs').select('*').eq('inventory_no',inv).order('writeoff_date',{ascending:false}).limit(1);const {data,error}=await db.from(type).select('*').eq('inventory_no',inv);if(error){alert('შემოწმების შეცდომა: '+error.message);return}if(!data?.length){const typeLabel=inventoryTables.find(x=>x.table===type)?.type||type;const msg=wo?.length?`📕 ნომერი ${inv} ჩამოწერის ისტორიაში ფიქსირდება.\nთარიღი: ${wo[0].writeoff_date||'-'}\nმიზეზი: ${wo[0].reason||'-'}\n\nმიუხედავად ამისა, გსურთ ამ ნომრით ახალი აქტიური ინვენტარის ჩანაწერის შექმნა და ამ პიროვნებაზე დაწერა?`:`საინვენტარო ნომერი ${inv} ამ კატეგორიაში არ არსებობს.\n\nგსურთ ახალი ${typeLabel}-ის ჩანაწერის შექმნა და ამ პიროვნებაზე დაწერა?`;if(!confirm(msg))return;const cfg=Object.values(configs).find(c=>c.table===type);const payload={inventory_no:inv,person_id:newPid};const nameField=cfg?.fields.find(f=>f[0]==='name');if(nameField){const name=prompt(`შეიყვანე ახალი ინვენტარის დასახელება (${typeLabel}):`,'');if(name===null)return;if(!name.trim()){alert('❌ ინვენტარის დასახელება აუცილებელია.');return}payload.name=name.trim()}if(type==='internal_drives'||type==='external_drives'){const d=prompt('მიუთითე დისკის ტიპი: HDD ან SSD','HDD');if(d===null)return;const dt=d.trim().toUpperCase();if(!['HDD','SSD'].includes(dt)){alert('❌ დისკის ტიპი უნდა იყოს HDD ან SSD.');return}payload.drive_type=dt}const cr=await db.from(type).insert(payload).select('*').single();if(cr.error){alert('❌ ახალი ინვენტარის შექმნა ვერ მოხერხდა: '+cr.error.message);return}await logHistory(inv,type,null,newPid,wo?.length?'ჩამოწერილი ნომერი ხელახლა შემოვიდა და მიება პიროვნებას':'ახალი ინვენტარი შემოვიდა და მიება პიროვნებას');alert(wo?.length?'📕 ჩამოწერილი async function assignInventory(table,id,newPid){const {data:item,error}=await db.from(table).select('*').eq('id',id).single();if(error){alert(error.message);return}if(item.person_id&&item.person_id!==newPid){const {data:old}=await db.from('persons').select('*').eq('id',item.person_id).single();const ok=confirm(`ეს ინვენტარი უკვე აწერია ${old?.first_name||''} ${old?.last_name||''}-ს.\n\nგსურს თანხმობით გადაცემა ახალ პასუხისმგებელზე?`);if(!ok)return;await db.from(table).update({person_id:newPid,notes:inventoryNotesWithDelivery(item.notes,true)}).eq('id',id);await logHistory(item.inventory_no,table,item.person_id,newPid,'პასუხისმგებლობის გადაცემა — მომხმარებლის თანხმობით');}else{await db.from(table).update({person_id:newPid,notes:inventoryNotesWithDelivery(item.notes,true)}).eq('id',id);await logHistory(item.inventory_no,table,null,newPid,'ახალი პასუხისმგებლობის მინიჭება')}if((await db.from(table).select('id').eq('id',id)).error){return}alert('✅ ინვენტარი წარმატებით მიება პასუხისმგებელ პირს.');await personInventory(newPid)}
async function removeResponsibility(table,id,pid,inv){
  if(!confirm(`მოიხსნას საინვენტარო № ${inv} პასუხისმგებლობიდან?\n\n⚠️ ეს ოპერაცია ინვენტარს არ ჩამოწერს.\nინვენტარი დარჩება სისტემაში და ხელმისაწვდომი იქნება სხვა პიროვნებაზე გადასაცემად.`))return;
  const q=await db.from(table).select('*').eq('id',id).single();
  if(q.error||!q.data){alert('ინვენტარის მოძიების შეცდომა: '+(q.error?.message||'ჩანაწერი ვერ მოიძებნა'));return}
  const item=q.data;
  if(!item.person_id){alert('ℹ️ ამ ინვენტარს პასუხისმგებელი პირი უკვე არ ჰყავს.');return}
  const u=await db.from(table).update({person_id:null}).eq('id',id);
  if(u.error){alert('❌ პასუხისმგებლობის მოხსნა ვერ მოხერხდა: '+u.error.message);return}
  const h=await logHistory(inv,table,pid,null,'პასუხისმგებლობის მოხსნა — ინვენტარი არ ჩამოწერილა');
  if(h?.error){await db.from(table).update({person_id:pid}).eq('id',id);alert('❌ ისტორიის ჩაწერა ვერ მოხერხდა: '+h.error.message+'\n\nპასუხისმგებლობა აღდგენილია.');return}
  alert(`✅ პასუხისმგებლობა მოიხსნა.\n\nსაინვენტარო №: ${inv}\nსტატუსი: თავისუფალი / პასუხისმგებლობის გარეშე\n\n📕 ინვენტარი არ ჩამოწერილა.`);
  await personInventory(pid);
}

async function openWriteoffForInventory(table,id){
  const q=await db.from(table).select('*').eq('id',id).single();
  if(q.error||!q.data){alert('ინვენტარის მოძიების შეცდომა: '+(q.error?.message||'ჩანაწერი ვერ მოიძებნა'));return}
  const item=q.data;
  const inv=item.inventory_no||'';
  const typeLabel=inventoryTables.find(x=>x.table===table)?.type||table;
  const cfg=inventoryTables.find(x=>x.table===table);
  const objectName=item[cfg?.nameField]||item.name||item.model||'';
  let formerUser='';
  if(item.person_id){const {data:p}=await db.from('persons').select('first_name,last_name').eq('id',item.person_id).single();formerUser=p?`${p.first_name||''} ${p.last_name||''}`.trim():''}
  const writeoffData=await openWriteoffModal(typeLabel,inv,objectName,formerUser);
  if(!writeoffData)return;
  if(!confirm(`დადასტურება\n\n📕 საინვენტარო № ${inv} ჩამოიწერება.\n📍 ${writeoffData.destination}\n\nგავაგრძელოთ?`))return;
  const u=await db.from(table).update({person_id:null,active:false}).eq('id',id);
  if(u.error){alert('❌ ინვენტარის ჩამოწერა ვერ მოხერხდა: '+u.error.message);return}
  const comment=[writeoffData.destination?`სად წავიდა: ${writeoffData.destination}`:'',writeoffData.comment||''].filter(Boolean).join('\n');
  const wo=await db.from('inventory_writeoffs').insert({inventory_no:inv,object_type:typeLabel,object_name:objectName||null,writeoff_date:writeoffData.writeoffDate,reason:writeoffData.reason,former_user:formerUser||null,comment:comment||null}).select().single();
  if(wo.error){await db.from(table).update({person_id:item.person_id||null,active:item.active!==false}).eq('id',id);alert('❌ ჩამოწერის ისტორიაში ჩაწერა ვერ მოხერხდა: '+wo.error.message+'\n\nინვენტარის წინა მდგომარეობა აღდგენილია.');return false}
  await logHistory(inv,table,item.person_id||null,null,`ინვენტარის ჩამოწერა — ${writeoffData.reason}${writeoffData.destination?' • სად წავიდა: '+writeoffData.destination:''}`);
  alert(`📕 ინვენტარი ჩამოიწერა და ცალკე ისტორიაში დაფიქსირდა.\n\nსაინვენტარო №: ${inv}\n📍 სად წავიდა: ${writeoffData.destination}`);
  loadRecords();
  return true;
}

async function openWriteoffModal(typeLabel,inv,objectName,formerUser){

    const today=new Date().toISOString().slice(0,10);
    ov.innerHTML=`<div style="background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)">
      <div class="toolbar"><h2 style="margin-right:auto">📕 ინვენტარის ჩამოწერა</h2><button type="button" class="close" id="writeoffCancel">✕</button></div>
      <div class="person-box"><b>ინვენტარის ტიპი:</b> ${esc(typeLabel)}<br><b>საინვენტარო №:</b> ${esc(inv)}<br><b>ობიექტი:</b> ${esc(objectName||'—')}<br><b>ყოფილი პასუხისმგებელი:</b> ${esc(formerUser||'—')}</div>
      <div class="grid" style="margin-top:14px">
        <div class="field"><label>ჩამოწერის თარიღი *</label><input id="woDate" type="date" value="${today}" required></div>
        <div class="field full"><label>ჩამოწერის მიზეზი *</label><textarea id="woReason" placeholder="მაგ. დაზიანებულია, მოძველებულია, აღარ ექვემდებარება გამოყენებას..." required></textarea></div>
        <div class="field full"><label>📍 სად წავიდა ინვენტარი / მისამართი *</label><input id="woDestination" placeholder="მაგ. საწყობი №2, ფილიალი, მისამართი, სხვა დაწესებულება..." required></div>
        <div class="field full"><label>დამატებითი კომენტარი</label><textarea id="woComment" placeholder="დამატებითი ინფორმაცია"></textarea></div>
      </div>
      <div class="status" style="margin-top:14px;background:#fff7ed;color:#9a3412">⚠️ ეს არის <b>ცალკე ჩამოწერის ოპერაცია</b>. დადასტურების შემდეგ ინვენტარი გახდება <b>უმოქმედო / ჩამოწერილი</b> და ჩაიწერება 📕 ჩამოწერის ისტორიაში.</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px"><button type="button" class="btn btn-secondary" id="writeoffCancel2">გაუქმება</button><button type="button" class="btn btn-danger" id="writeoffConfirm">📕 ჩამოწერა</button></div>
    </div>`;
    document.body.appendChild(ov);
    const cancel=()=>{ov.remove();resolve(null)};
    ov.querySelector('#writeoffCancel').onclick=cancel; ov.querySelector('#writeoffCancel2').onclick=cancel;
    ov.onclick=e=>{if(e.target===ov)cancel()};
    ov.querySelector('#writeoffConfirm').onclick=()=>{
      const reason=ov.querySelector('#woReason').value.trim(), destination=ov.querySelector('#woDestination').value.trim(), writeoffDate=ov.querySelector('#woDate').value||today, comment=ov.querySelector('#woComment').value.trim();
      if(!reason){alert('❌ ჩამოწერის მიზეზი აუცილებელია.');return}
      if(!destination){alert('❌ მიუთითე სად წავიდა ინვენტარი / მისამართი.');return}
      ov.remove(); resolve({reason,destination,writeoffDate,comment});
    };
  });
}

function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector('script[data-excel-lib]')) return resolve(true);
    const s=document.createElement('script');s.src=src;s.dataset.excelLib="1";
    s.onload=()=>resolve(true);s.onerror=()=>reject(new Error("Excel-ის ბიბლიოთეკის ჩატვირთვა ვერ მოხერხდა."));
    document.head.appendChild(s);
  });
}
function excelClean(v){return String(v??'').replace(/\s+/g,' ').trim()}
function excelIsInventoryHeader(h){
  h=excelClean(h).toLowerCase();
  if(!h)return false;
  const keys=['კეისი','ქეისი','case','მონიტორ','monitor','voip','ups','hdd','ssd','პრინტერ','printer','სკანერ','scanner','სკამ','chair','მაგიდა','desk','სეიფ','notebook','tv','dvd','ვინჩესტერ','ვიდეოკარტ','აკუმულატორ','switch','ქვიჩ'];
  return keys.some(k=>h.includes(k));
}
function excelExtractRefs(value){
  const s=excelClean(value); if(!s)return [];
  const out=[]; const invRx=/(?<!\d)(\d{3,6})(?!\d)/g; let m;
  while((m=invRx.exec(s))!==null){
    const n=m[1];
    if(!out.includes(n))out.push(n);
  }
  return out;
}
function excelNameFromRow(headers,row){
  let first='',last='';
  headers.forEach((h,i)=>{
    const k=excelClean(h).toLowerCase(),v=excelClean(row[i]);
    if(!v)return;
    if(k==='სახელი'||k==='first name'||k.includes('სახელი')) first=first||v;
    if(k==='გვარი'||k==='last name'||k.includes('გვარი')) last=last||v;
  });
  return {first,last,full:[first,last].filter(Boolean).join(' ')};
}
function excelPersonIdFromRow(headers,row){

  let id='',room='',floor='',serial='';

    const k=excelClean(h).toLowerCase(),v=excelClean(row[i]);
    if(!v)return;
    if(k==='id'||k==='პირადი id'||k.includes('პირადი')) id=id||v;
    if(k.includes('საკონტაქტო')||k.includes('მობილ')||k.includes('ტელეფონ')) phones.push(v);
    if(k==='n'||k==='№') serial=serial||v;
    else if(!serial && k.includes('რიგითი')) serial=v;
    if(k.includes('სართული')) floor=floor||v;
    if(k.includes('ოთახ')) room=room||v;
  });
  const contacts=[];
  phones.forEach(v=>excelParseContacts(v).forEach(x=>{if(!contacts.includes(x)&&contacts.length<4)contacts.push(x)}));
  return {first:n.first,last:n.last,full:n.full,personalId:id,phone:contacts.join(' / '),contacts,room,floor,serial};
}
function excelNormalizeWorkbook(workbook, selectedSheet=""){
  const records=[], peopleMap=new Map(), invMap=new Map(), allSheetNames=workbook.SheetNames||[];
  const sheetNames=selectedSheet && selectedSheet!=="__ALL__" ? allSheetNames.filter(x=>x===selectedSheet) : allSheetNames;
  sheetNames.forEach(sheetName=>{
    const ws=workbook.Sheets[sheetName]; const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
    if(!rows.length)return;
    let headerIndex=0;
    while(headerIndex<Math.min(rows.length,10)&&rows[headerIndex].filter(x=>excelClean(x)).length===0)headerIndex++;
    const headers=(rows[headerIndex]||[]).map((x,i)=>excelClean(x)||('სვეტი '+(i+1)));
    const invCols=headers.map((h,i)=>excelIsInventoryHeader(h)?i:-1).filter(i=>i>=0);
    const hasNames=headers.some(h=>{const k=h.toLowerCase();return k==='სახელი'||k.includes('სახელი')}) &&
                  headers.some(h=>{const k=h.toLowerCase();return k==='გვარი'||k.includes('გვარი')});
    for(let ri=headerIndex+1;ri<rows.length;ri++){
      const row=rows[ri]||[]; if(!row.some(x=>excelClean(x)))continue;
      const person=excelPersonIdFromRow(headers,row);
      const refs=[];
      invCols.forEach(ci=>excelExtractRefs(row[ci]).forEach(ref=>refs.push({inventoryNo:ref,field:headers[ci],value:excelClean(row[ci])})));
      // Sheets with explicit case/monitor/inventory columns are also useful even when names are absent.
      if(!refs.length && !hasNames) continue;
      if(person.full){
        const key=excelPersonKey(person) || (sheetName+'#'+ri);
        if(!peopleMap.has(key))peopleMap.set(key,{...person,sheets:new Set([sheetName])});
        else peopleMap.get(key).sheets.add(sheetName);
      }
      refs.forEach(ref=>{
        const rec={sheet:sheetName,row:ri+1,personName:person.full,firstName:person.first,lastName:person.last,personalId:person.personalId,phone:person.phone,room:person.room,floor:person.floor,serial:person.serial,inventoryNo:ref.inventoryNo,inventoryField:ref.field,sourceValue:ref.value,category:excelGuessTable(ref.field,ref.value),cancelled:/გაუქმებულ|ჩამოწერილ|ჩამოწერა|cancel/i.test((ref.field||'')+' '+(ref.value||''))};
        records.push(rec);
        const ik=ref.inventoryNo;
        if(!invMap.has(ik))invMap.set(ik,[]);
        invMap.get(ik).push(rec);
      });
    }
    // Special compact sheets: NOTEBOOK has a person and a notebook number but may not have a generic inventory header.
    if(sheetName.toLowerCase()==='notebook'){
      for(let ri=headerIndex+1;ri<rows.length;ri++){
        const row=rows[ri]||[]; const person=excelPersonIdFromRow(headers,row);
        const idx=headers.findIndex(h=>h.toLowerCase().includes('notebook'));
        if(idx>=0){excelExtractRefs(row[idx]).forEach(ref=>{const rec={sheet:sheetName,row:ri+1,personName:person.full,firstName:person.first,lastName:person.last,personalId:person.personalId,phone:person.phone,room:person.room,floor:person.floor,serial:person.serial,inventoryNo:ref,inventoryField:headers[idx],sourceValue:excelClean(row[idx]),category:'computers',cancelled:false};records.push(rec);if(!invMap.has(ref))invMap.set(ref,[]);invMap.get(ref).push(rec);});}
      }
    }
  });
  excelImportedRows=records;
  excelImportedPeople=[...peopleMap.values()].map(p=>({...p,sheets:[...p.sheets]}));
  excelImportedMeta={fileName:excelImportedMeta.fileName,sheets:sheetNames.length,people:excelImportedPeople.length,inventoryRefs:records.length,loadedAt:new Date().toISOString(),selectedSheet:selectedSheet||"__ALL__"};
  return {records,people:excelImportedPeople,invMap};
}

function excelGuessTable(field, value){
  const s=(String(field||'')+' '+String(value||'')).toLowerCase();
  if(/notebook|ლეპტოპ/.test(s)) return 'computers';
  if(/კეისი|ქეისი|case|კომპიუტ|computer/.test(s)) return 'computers';
  if(/მონიტორ|monitor/.test(s)) return 'monitors';
  if(/პრინტერ|printer/.test(s)) return 'printers';
  if(/სკანერ|scanner/.test(s)) return 'scanners';
  if(/(^|[^a-z])ups([^a-z]|$)|ups|უპს/.test(s)) return 'ups';
  if(/გარე[- ]?ვინჩესტერ|external.*(hdd|ssd)|გარე.*hdd|გარე.*ssd/.test(s)) return 'external_drives';
  if(/hdd|ssd|ვინჩესტერ|დისკ/.test(s)) return 'internal_drives';
  if(/voip|ip ტელ|ტელეფონ/.test(s)) return 'voip_phones';
  if(/მაგიდა|desk/.test(s)) return 'desks';
  if(/სკამ|სავარძ|chair/.test(s)) return 'chairs';
  if(/მაცივარ|refrigerator/.test(s)) return 'refrigerators';
  return 'other_inventory';
}
function excelSafeName(r){

  setStatus(`🟢 იმპორტი დასრულდა • ახალი პიროვნება +${addedPeople} • განახლებული +${updatedPeople} • ინვენტარი +${addedInv} • არსებული ინვენტარი ${skippedInv} • კონფლიქტი ${skippedConflicts} • შეცდომა ${failed}`,failed>0);
  document.getElementById('excelImportPreview').innerHTML=`<div class="inv-status ${failed?'inv-used':'inv-free'}">${failed?'⚠️':'✅'} იმპორტი დასრულდა.<br>👤 ახალი პიროვნებები: <b>${addedPeople}</b><br>🔄 განახლებული პიროვნებები: <b>${updatedPeople}</b><br>📦 ახალი ინვენტარი: <b>${addedInv}</b><br>⚪ უკვე არსებული ინვენტარი: <b>${skippedInv}</b><br>🔴 კონფლიქტის გამო გამოტოვებული: <b>${skippedConflicts}</b>${failed?'<br>❌ შეცდომით გამოტოვებული ჩანაწერები: <b>'+failed+'</b>':''}</div>`;
  window.__excelImportPlan=null;
}

async function checklistGetAll(){const d=await idbOpen();return new Promise((res,rej)=>{const tx=d.transaction("inventory_checklist","readonly");const r=tx.objectStore("inventory_checklist").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function checklistBulkStatus(numbers){const wanted=new Set((numbers||[]).map(x=>String(x||'').trim()).filter(Boolean));const map=new Map();if(!wanted.size)return map;try{const {data:wo}=await db.from('inventory_writeoffs').select('inventory_no,writeoff_date').in('inventory_no',[...wanted]);(wo||[]).forEach(r=>{if(!String(r.comment||'').includes('♻️ აღდგენილია:'))map.set(String(r.inventory_no).trim(),{status:'written',writeoff:r})});}catch(e){console.warn('checklist writeoffs lookup',e)}for(const x of inventoryTables){try{const {data,error}=await db.from(x.table).select('id,inventory_no,person_id').in('inventory_no',[...wanted]);if(error)continue;(data||[]).forEach(r=>{const n=String(r.inventory_no||'').trim();if(n&&!map.has(n))map.set(n,{status:r.person_id?'used':'free',table:x.table,type:x.type,row:r})})}catch(e){console.warn('checklist lookup',x.table,e)}}return map}
async function checklistDelete(id){if(!confirm('ამ ნომრის სიიდან წაშლა გინდა?'))return;const d=await idbOpen();await new Promise((res,rej)=>{const tx=d.transaction("inventory_checklist","readwrite");tx.objectStore("inventory_checklist").delete(Number(id));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});inventoryChecklistView()}
async function checklistAdd(inv,damaged){inv=String(inv||'').trim();if(!inv)return false;const all=await checklistGetAll();if(all.some(x=>String(x.inventory_no).trim()===inv)){alert('⚠️ ეს საინვენტარო ნომერი სიაში უკვე დამატებულია.');return false}const map=await checklistBulkStatus([inv]);const st=map.get(inv)||{status:'none'};const item={inventory_no:inv,damaged:!!damaged,status:st.status,table:st.table||null,type:st.type||null,inventory_id:st.row?.id||null,added_at:new Date().toISOString()};const d=await idbOpen();await new Promise((res,rej)=>{const tx=d.transaction("inventory_checklist","readwrite");tx.objectStore("inventory_checklist").add(item);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return true}
async function checklistRefreshStatuses(){const all=await checklistGetAll();if(!all.length)return all;const map=await checklistBulkStatus(all.map(x=>x.inventory_no));const d=await idbOpen();await new Promise((res,rej)=>{const tx=d.transaction("inventory_checklist","readwrite");const os=tx.objectStore("inventory_checklist");all.forEach(item=>{const st=map.get(String(item.inventory_no).trim())||{status:'none'};item.status=st.status;item.table=st.table||null;item.type=st.type||null;item.inventory_id=st.row?.id||null;os.put(item)});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return checklistGetAll()}
async function addChecklistFromInput(){const input=document.getElementById('checklistInvInput');const damaged=document.getElementById('checklistDamaged');const inv=input?.value.trim();if(!inv)return;setStatus('🔎 საინვენტარო ნომერი მოწმდება...');const ok=await checklistAdd(inv,!!damaged?.checked);if(ok){input.value='';if(damaged)damaged.checked=false;setStatus('🟢 ნომერი დაემატა საინვენტარო სიაში');inventoryChecklistView()}else setStatus('⚠️ ნომერი სიაში ვერ დაემატა',true)}
async function toggleChecklistDamaged(id,val){const all=await checklistGetAll();const item=all.find(x=>Number(x.id)===Number(id));if(!item)return;item.damaged=!!val;const d=await idbOpen();await new Promise((res,rej)=>{const tx=d.transaction("inventory_checklist","readwrite");tx.objectStore("inventory_checklist").put(item);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});inventoryChecklistView()}
async function sendChecklistToWriteoff(id){const all=await checklistGetAll();const item=all.find(x=>Number(x.id)===Number(id));if(!item)return;if(!item.damaged){alert('ჯერ მონიშნე, რომ ინვენტარი დაზიანებულია.');return}const st=await findInventoryStatus(item.inventory_no);if(!st.row||!st.table){alert('🔴 ეს ნომერი პროგრამაში ვერ მოიძებნა, ამიტომ ჩამოწერაში გადატანა ჯერ შეუძლებელია.');return}await openWriteoffForInventory(st.table,st.row.id);const latest=await findInventoryStatus(item.inventory_no);if(latest.status==='written'){const d=await idbOpen();await new Promise((res,rej)=>{const tx=d.transaction("inventory_checklist","readwrite");tx.objectStore("inventory_checklist").delete(Number(id));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});inventoryChecklistView()}}
async function clearChecklist(){const all=await checklistGetAll();if(!all.length){alert('სია უკვე ცარიელია.');return}if(!confirm(`სიის მთლიანად გასუფთავება?\n\nწაიშლება ${all.length} ნომერი.\nეს არ წაშლის ინვენტარს პროგრამიდან — მხოლოდ ამ სამუშაო სიას გაასუფთავებს.`))return;const d=await idbOpen();await new Promise((res,rej)=>{const tx=d.transaction("inventory_checklist","readwrite");const os=tx.objectStore("inventory_checklist");all.forEach(x=>os.delete(x.id));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});inventoryChecklistView()}

async function getCurrentUserDisplayName(){
  const u=currentAuthUser||{};
  const md=u.user_metadata||{};
  const metadataName=String(md.full_name||md.display_name||[md.first_name,md.last_name].filter(Boolean).join(' ')||'').trim();
  if(!db||!u.id)return metadataName||u.email||'უცნობი მომხმარებელი';
  try{
    const {data,error}=await db.from('messenger_profiles').select('display_name,email').eq('user_id',u.id).maybeSingle();
    if(!error && data?.display_name?.trim()) return data.display_name.trim();
  }catch(e){}
  return metadataName||u.email||'უცნობი მომხმარებელი';
}
async function addUserInventoryProblem(){
  const inv=String(document.getElementById('userProblemInv')?.value||'').trim();
  const text=String(document.getElementById('userProblemText')?.value||'').trim();
  if(!inv){alert('შეიყვანე საინვენტარო ნომერი.');return}
  if(!text){alert('აღწერე პრობლემა. მაგალითად: „ხან ბეჭდავს, ხან არა“.');return}
  if(!db||offlineMode||!navigator.onLine){alert('პრობლემის შენახვა ამ ეტაპზე ინტერნეტთან დაკავშირებას საჭიროებს.');return}
  try{
    setStatus('🔎 ინვენტარს ვამოწმებ...');
    const st=await userProblemsFindInventory(inv);
    if(!st.row||!st.table){
      if(!confirm('⚠️ ეს საინვენტარო ნომერი სისტემაში ვერ მოიძებნა.\n\nმაინც შევინახოთ მომხმარებლის შეტყობინება?'))return;
    }
    const personId=st.row?.person_id||null;
    const reporterName=await getCurrentUserDisplayName();
    const reporterEmail=currentAuthUser?.email||'';
    const reporterLabel=reporterEmail && reporterName!==reporterEmail ? `${reporterName} (${reporterEmail})` : reporterName;
    const ownerPerson=personId ? (await db.from('persons').select('first_name,last_name').eq('id',personId).maybeSingle()).data : null;
    const ownerName=ownerPerson ? [ownerPerson.first_name,ownerPerson.last_name].filter(Boolean).join(' ').trim() : '';
    const payload={
      inventory_no:inv,
      inventory_type:st.type||null,
      // inventory_id intentionally omitted: inventory tables may use different ID types.
      // inventory_no is the stable identifier used by this problem tracker.
      person_id:personId,
      reported_by:currentAuthUser?.id||null,
      // Existing column is reused so no database migration is required.
      // The saved value contains the user's automatic full name and email.
      reported_by_email:reporterLabel,
      problem_text:text,
      status:'open'
    };
    const {error}=await db.from('inventory_problems').insert(payload);
    if(error) throw new Error(error.message);
    document.getElementById('userProblemInv').value='';
    document.getElementById('userProblemText').value='';
    setStatus('✅ მომხმარებლის პრობლემა შენახულია');
    await userProblemsView();
  }catch(e){console.error(e);setStatus('⚠️ პრობლემის შენახვა ვერ მოხერხდა: '+e.message,true);alert('პრობლემის შენახვა ვერ მოხერხდა:\n'+e.message)}
}
async function updateUserInventoryProblem(id,status){
  if(!db||offlineMode||!navigator.onLine){alert('სტატუსის შეცვლა ინტერნეტთან დაკავშირებას საჭიროებს.');return}
  const labels={open:'ღია',repair:'🔧 შეკეთებაში',resolved:'✅ მოგვარებულია'};
  const note=status==='resolved'?prompt('მოკლე ჩანაწერი პრობლემის მოგვარებაზე (სურვილის შემთხვევაში):','პრობლემა მოგვარდა') : null;
  if(status==='resolved'&&note===null)return;
  const payload={status};
  if(status==='resolved'){payload.resolved_at=new Date().toISOString();payload.resolution_note=note||''}
  else {payload.resolved_at=null;payload.resolution_note=null}
  const {error}=await db.from('inventory_problems').update(payload).eq('id',id);
  if(error){alert('სტატუსის შეცვლა ვერ მოხერხდა:\n'+error.message);return}
  setStatus('სტატუსი შეიცვალა: '+(labels[status]||status));
  userProblemsView();
}
async function sendProblemInventoryToWriteoff(problemId,inventoryNo){
  if(!db||offlineMode||!navigator.onLine){alert('ჩამოწერა ინტერნეტთან დაკავშირებას საჭიროებს.');return}
  const inv=String(inventoryNo||'').trim();
  const st=await userProblemsFindInventory(inv);
  if(!st.row||!st.table){alert('❌ ეს საინვენტარო ნომერი სისტემაში ვეღარ მოიძებნა.');return}
  if(st.row.active===false){alert('ℹ️ ეს ინვენტარი უკვე უმოქმედოა/ჩამოწერილია.');return}
  if(!confirm(`⚠️ პრობლემა ვერ მოგვარდა?\n\nსაინვენტარო № ${inv} გაიგზავნება ჩამოწერაში. ჩამოწერის შემდეგ ინვენტარი აღარ იქნება მომხმარებელზე მიბმული.\n\nგავაგრძელოთ?`))return
  const written=await openWriteoffForInventory(st.table,st.row.id);
  if(!written)return
  const {error}=await db.from('inventory_problems').update({status:'resolved',resolved_at:new Date().toISOString(),resolution_note:'შეკეთება ვერ მოხერხდა — ინვენტარი ჩამოიწერა და მომხმარებელს პასუხისმგებლობა მოეხსნა.'}).eq('id',problemId);
  if(error){alert('⚠️ ინვენტარი ჩამოიწერა, მაგრამ პრობლემის სტატუსი ვერ განახლდა: '+error.message);return}
  alert('📕 ინვენტარი ჩამოიწერა.\n👤 მომხმარებელს პასუხისმგებლობა მოეხსნა.');
  await userProblemsView();
}
async function deleteUserInventoryProblem(id){

function excelParseContacts(value){
  const s=excelClean(value); if(!s)return [];
  const found=[];
  const add=(raw)=>{
    let x=excelClean(raw).replace(/[^0-9+]/g,'');
    if(!x)return;
    if(x.startsWith('+995')) x=x.slice(4);
    else if(x.startsWith('995') && x.length>=12) x=x.slice(3);
    if(x.startsWith('0') && x.length===10) x=x.slice(1);
    // ქართული მობილური: 5XXXXXXXX, ქალაქის: 32XXXXXXX
    if(/^5\d{8}$/.test(x) || /^32\d{7}$/.test(x)){
      const normalized='0'+x;
      if(!found.includes(normalized))found.push(normalized);
    }
  };
  // ვპოულობთ როგორც +995 5xx xx xx xx / 0 5xx xx xx xx, ისე Excel-ში
  // რიცხვით შენახულ 9-ნიშნა ნომერს (მაგ. 595889500).
  const chunks=s.split(/[;,/|\n]+/).map(excelClean).filter(Boolean);
  chunks.forEach(chunk=>{
    const compact=chunk.replace(/[^0-9+]/g,'');
    if(/^\+?9955\d{8}$/.test(compact)||/^99532\d{7}$/.test(compact)||/^0(?:5\d{8}|32\d{7})$/.test(compact)||/^(?:5\d{8}|32\d{7})$/.test(compact)){
      add(compact);
      return;
    }
    const phoneRx=/(?:\+?995\s*|0\s*)?(?:5\d{2}|32)\s*\d{2}\s*\d{2}\s*\d{2}/g;
    let m;
    while((m=phoneRx.exec(chunk))!==null){ add(m[0]); if(found.length>=4)break; }
  });
  // თუ ნომერი სხვა ტექსტთან ერთადაა, მაინც ამოვიღოთ 9-ნიშნა ქართული ნომერი.
  if(found.length<4){
    const digits=s.replace(/\D/g,' ');
    const phone9Rx=/(?:995)?(5\d{8}|32\d{7})/g; let m;
    while((m=phone9Rx.exec(digits))!==null){ add(m[0]); if(found.length>=4)break; }
  }
  return found.slice(0,4);
}

async function updateExcelArrangedField(idx,field,value){
  const i=Number(idx); const rows=window.__excelArrangedRows||[]; const r=rows[i]; const p=excelImportedPeople[i];
  if(!r||!p)return;
  value=String(value??'').trim();
  if(field==='n'){r.n=excelSerialKey(value);p.serial=r.n;}
  else if(field==='id'){r.id=value;p.personalId=value;}
  else if(field==='first'){r.first=value;p.first=value;}
  else if(field==='last'){r.last=value;p.last=value;}
  else if(field==='position'){r.position=value;p.position=value;}
  else if(field==='room'){r.room=value;p.room=value;}
  else if(field==='floor'){r.floor=value;p.floor=value;}
  else if(/^contact[0-3]$/.test(field)){const ci=Number(field.slice(7));r.contacts[ci]=value;p.contacts=Array.isArray(p.contacts)?p.contacts.slice(0,4):[];while(p.contacts.length<4)p.contacts.push('');p.contacts[ci]=value;p.phone=p.contacts.filter(Boolean).join(' / ');}
  const st=document.getElementById('excelEditStatus'); if(st){st.textContent='💾 ცვლილება შენახულია';setTimeout(()=>{if(st)st.textContent='✏️ რედაქტირება მზადაა'},900)}
  await saveExcelImport();
}

  openPersonForm({
