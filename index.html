const OFF_DB="inventory_offline_v2";
const OFF_VER=1;
const OFF_TABLES="tables";
const OFF_QUEUE="queue";
let offlineMode=false, syncBusy=false, db=null;

function idbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(OFF_DB,OFF_VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(OFF_TABLES))d.createObjectStore(OFF_TABLES);if(!d.objectStoreNames.contains(OFF_QUEUE))d.createObjectStore(OFF_QUEUE,{keyPath:"qid",autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function idbSetTable(name,rows){const d=await idbOpen();return new Promise((res,rej)=>{const tx=d.transaction(OFF_TABLES,"readwrite");tx.objectStore(OFF_TABLES).put(rows,name);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbGetTable(name){const d=await idbOpen();return new Promise((res,rej)=>{const tx=d.transaction(OFF_TABLES,"readonly");const r=tx.objectStore(OFF_TABLES).get(name);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function idbQueue(item){const d=await idbOpen();return new Promise((res,rej)=>{const tx=d.transaction(OFF_QUEUE,"readwrite");tx.objectStore(OFF_QUEUE).add({...item,queued_at:new Date().toISOString()});tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbQueueAll(){const d=await idbOpen();return new Promise((res,rej)=>{const tx=d.transaction(OFF_QUEUE,"readonly");const r=tx.objectStore(OFF_QUEUE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function idbDeleteQueue(qid){const d=await idbOpen();return new Promise((res,rej)=>{const tx=d.transaction(OFF_QUEUE,"readwrite");tx.objectStore(OFF_QUEUE).delete(qid);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

function localUuid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==="x"?r:(r&3|8);return v.toString(16)})}
function clone(x){return JSON.parse(JSON.stringify(x))}
function applyLocal(q,rows){let a=rows.slice();for(const f of q.filters){if(f.kind==="eq")a=a.filter(r=>String(r[f.col]??"")===String(f.val??""));else if(f.kind==="in")a=a.filter(r=>f.vals.includes(r[f.col]));else if(f.kind==="or")a=a.filter(r=>f.parts.some(p=>{const m=p.match(/^(\w+)\.ilike\.%(.+)%$/);return m&&String(r[m[1]]??"").toLowerCase().includes(m[2].toLowerCase())}));else if(f.kind==="not"&&f.op==="is"&&f.val===null)a=a.filter(r=>r[f.col]!==null&&r[f.col]!==undefined)}if(q.orderCol)a.sort((x,y)=>{const av=x[q.orderCol],bv=y[q.orderCol];if(av==bv)return 0;const z=av>bv?1:-1;return q.orderAsc?z:-z});if(q.limitN!=null)a=a.slice(0,q.limitN);if(q.columns&&q.columns!=="*"){const cols=q.columns.split(",").map(x=>x.trim());a=a.map(r=>{const o={};cols.forEach(c=>o[c]=r[c]);return o})}return a}

class LocalQuery{constructor(table){this.table=table;this.op="select";this.payload=null;this.filters=[];this.orderCol=null;this.orderAsc=true;this.limitN=null;this.columns="*";this.wantSingle=false}
 select(c="*"){this.columns=c;if(this.op==="select")this.op="select";return this} eq(c,v){this.filters.push({kind:"eq",col:c,val:v});return this} in(c,v){this.filters.push({kind:"in",col:c,vals:v});return this} or(x){this.filters.push({kind:"or",parts:x.split(",")});return this} not(c,o,v){this.filters.push({kind:"not",col:c,op:o,val:v});return this} order(c,o={}){this.orderCol=c;this.orderAsc=o.ascending!==false;return this} limit(n){this.limitN=n;return this} single(){this.wantSingle=true;return this}
 insert(payload){this.op="insert";this.payload=Array.isArray(payload)?payload.map(clone):[clone(payload)];return this} update(payload){this.op="update";this.payload=clone(payload);return this} delete(){this.op="delete";return this}
 async exec(){let rows=await idbGetTable(this.table);if(this.op==="select"){const out=applyLocal(this,rows);if(this.wantSingle)return {data:out[0]||null,error:out[0]?null:{message:"No rows found"}};return {data:out,error:null}}
 if(this.op==="insert"){const added=this.payload.map(r=>{const x=clone(r);if(x.id==null)x.id=localUuid();if(x.created_at==null)x.created_at=new Date().toISOString();if(x.updated_at==null)x.updated_at=new Date().toISOString();return x});rows.push(...added);await idbSetTable(this.table,rows);await idbQueue({action:"insert",table:this.table,rows:added});return {data:added.length===1?added[0]:added,error:null}}
 const matched=rows.filter(r=>this.filters.every(f=>f.kind==="eq"?String(r[f.col]??"")===String(f.val??""):f.kind==="in"?f.vals.includes(r[f.col]):true));
 if(this.op==="update"){rows=rows.map(r=>matched.some(m=>m.id===r.id)?{...r,...clone(this.payload),updated_at:new Date().toISOString()}:r);await idbSetTable(this.table,rows);await idbQueue({action:"update",table:this.table,filters:this.filters,payload:clone(this.payload)});const changed=rows.filter(r=>matched.some(m=>m.id===r.id));return {data:this.wantSingle?(changed[0]||null):changed,error:this.wantSingle&&!changed.length?{message:"No rows found"}:null}}
 if(this.op==="delete"){rows=rows.filter(r=>!matched.some(m=>m.id===r.id));await idbSetTable(this.table,rows);await idbQueue({action:"delete",table:this.table,filters:this.filters});return {data:null,error:null}}}
 then(a,b){return this.exec().then(a,b)} catch(a){return this.exec().catch(a)} finally(a){return this.exec().finally(a)}}

class OnlineQuery{constructor(real,table){this.real=real.from(table);this.table=table} select(c="*"){this.real=this.real.select(c);return this} eq(c,v){this.real=this.real.eq(c,v);return this} in(c,v){this.real=this.real.in(c,v);return this} or(x){this.real=this.real.or(x);return this} not(c,o,v){this.real=this.real.not(c,o,v);return this} order(c,o){this.real=this.real.order(c,o);return this} limit(n){this.real=this.real.limit(n);return this} single(){this.real=this.real.single();return this} insert(p){this.real=this.real.insert(p);return this} update(p){this.real=this.real.update(p);return this} delete(){this.real=this.real.delete();return this} then(a,b){return this.real.then(async r=>{if(r&&r.error==null)await cacheTable(this.table);return a?r&&a(r):r},b)} catch(a){return this.real.catch(a)} finally(a){return this.real.finally(a)}}

const dbFacade={from(table){return offlineMode?new LocalQuery(table):new OnlineQuery(sb,table)}};

async function cacheTable(table){if(!sb||!navigator.onLine)return;try{const {data,error}=await sb.from(table).select("*");if(!error)await idbSetTable(table,data||[])}catch(e){console.warn("cache",table,e)}}
async function cacheAllTables(){if(!sb||!navigator.onLine)return;setStatus("☁️ ონლაინ • მონაცემები კომპიუტერში ინახება...");for(const c of Object.values(configs))await cacheTable(c.table);setStatus("🟢 ONLINE • Supabase • ლოკალური ასლიც განახლებულია")}
async function syncOfflineQueue(){if(!sb||!navigator.onLine||syncBusy)return;syncBusy=true;try{const q=await idbQueueAll();if(!q.length){await cacheAllTables();return}setStatus("🔄 სინქრონიზაცია მიმდინარეობს...");for(const x of q){let res;if(x.action==="insert")res=await sb.from(x.table).insert(x.rows);else if(x.action==="update"){let rq=sb.from(x.table).update(x.payload);for(const f of x.filters||[])if(f.kind==="eq")rq=rq.eq(f.col,f.val);else if(f.kind==="in")rq=rq.in(f.col,f.vals);res=await rq}else if(x.action==="delete"){let rq=sb.from(x.table).delete();for(const f of x.filters||[])if(f.kind==="eq")rq=rq.eq(f.col,f.val);else if(f.kind==="in")rq=rq.in(f.col,f.vals);res=await rq}if(res?.error)throw new Error(res.error.message);await idbDeleteQueue(x.qid)}await cacheAllTables();setStatus("🟢 ONLINE • ცვლილებები სინქრონიზებულია")}catch(e){setStatus("⚠️ სინქრონიზაცია ვერ დასრულდა: "+e.message,true)}finally{syncBusy=false}}
window.addEventListener("online",async()=>{if(sb){offlineMode=false;setStatus("🌐 ინტერნეტი დაბრუნდა • სინქრონიზაცია...");await syncOfflineQueue();await loadRecords()}});window.addEventListener("offline",()=>{if(sb){offlineMode=true;setStatus("🔴 OFFLINE • მონაცემები ინახება ამ კომპიუტერში");loadRecords()}});

async function transferInventoryToPerson(inv,newPid,type){
 const st=await db.from('inventory_writeoffs').select('*').eq('inventory_no',inv).order('writeoff_date',{ascending:false}).limit(1);
 const wo=st.data?.[0]||null;
 let items=[];
 if(type){const q=await db.from(type).select('*').eq('inventory_no',inv);if(q.error)throw new Error(q.error.message);items=q.data||[];}
 else {const res=await findInventoryByNumber(inv);if(res.error)throw new Error(res.error.message);items=res.items;}
 if(items.length>1)throw new Error('საინვენტარო ნომერი ერთზე მეტ ჩანაწერშია გამოყენებული.');
 if(!items.length){
   if(!type)throw new Error('ინვენტარის ტიპი უნდა აირჩიოთ, რადგან ეს ნომერი სისტემაში ჯერ არ არსებობს.');
   const cfg=Object.values(configs).find(c=>c.table===type);const typeLabel=inventoryTables.find(x=>x.table===type)?.type||type;const payload={inventory_no:inv,person_id:newPid};
   const nameField=cfg?.fields.find(f=>f[0]==='name');
   if(nameField){const name=prompt(`შეიყვანე ახალი ინვენტარის დასახელება (${typeLabel}):`,'');if(name===null)throw new Error('შექმნა გაუქმებულია.');if(!name.trim())throw new Error('ინვენტარის დასახელება აუცილებელია.');payload.name=name.trim();}
   if(type==='internal_drives'||type==='external_drives'){const d=prompt('მიუთითე დისკის ტიპი: HDD ან SSD','HDD');if(d===null)throw new Error('შექმნა გაუქმებულია.');const dt=d.trim().toUpperCase();if(!['HDD','SSD'].includes(dt))throw new Error('დისკის ტიპი უნდა იყოს HDD ან SSD.');payload.drive_type=dt;}
   const cr=await db.from(type).insert(payload).select('*').single();if(cr.error)throw new Error('ახალი ინვენტარის შექმნა ვერ მოხერხდა: '+cr.error.message);
   await logHistory(inv,type,null,newPid,wo?'ჩამოწერილი ნომერი ხელახლა შემოვიდა და მიება ახალ პიროვნებას':'ახალი ინვენტარის შემოსვლა და პიროვნებაზე მიბმა');
   return {ok:true,created:true,writeoff:!!wo};
 }
 const r=items[0];const fromPid=r.person_id||null;
 if(fromPid&&String(fromPid)===String(newPid))return {ok:true,fromPid,writeoff:!!wo};
 if(fromPid){const {data:p}=await db.from('persons').select('first_name,last_name').eq('id',fromPid).single();const owner=p?`${p.first_name||''} ${p.last_name||''}`.trim():'სხვა მომხმარებელი';const ok=confirm(`საინვენტარო ნომერი ${inv} უკვე დაკავებულია.\n\nპასუხისმგებელი პირი: ${owner}\n${wo?'\n🔴 ეს ნომერი ასევე ფიქსირდება ჩამოწერის ისტორიაში.':''}\n\nგსურთ ძველი მომხმარებლისგან მოვხსნათ პასუხისმგებლობა და გადავაბაროთ ახალ პიროვნებას?`);if(!ok)return {ok:false,cancelled:true,fromPid,writeoff:!!wo};const oldErr=await db.from(r._table).update({person_id:null}).eq('id',r.id);if(oldErr.error)throw new Error('ძველი მომხმარებლისგან განთავისუფლება ვერ მოხერხდა: '+oldErr.error.message);}
 const ne=await db.from(r._table).update({person_id:newPid}).eq('id',r.id);if(ne.error)throw new Error('საინვენტარო ნომრის ახალ პიროვნებაზე მიბმა ვერ მოხერხდა: '+ne.error.message);
 await logHistory(inv,r._table,fromPid,newPid,wo?'ჩამოწერილი ნომერი ხელახლა მიება პიროვნებას':(fromPid?'პასუხისმგებლობა გადატანილია ახალი პიროვნების დამატებისას':'არსებული თავისუფალი ინვენტარი მიება პიროვნებას'));
 return {ok:true,fromPid,writeoff:!!wo};
}
async function savePerson(e){e.preventDefault();const contacts=[0,1,2,3].map(i=>document.getElementById('p_c'+i).value.trim()).filter(Boolean);const cab=document.getElementById('p_cab').value;const room=document.getElementById('p_room').value.trim();const inventoryNo=!editingId?(document.getElementById('p_inventory_no')?.value.trim()||''):'';const inventoryType=!editingId?(document.getElementById('p_inventory_type')?.value||''):'';const serialRaw=document.getElementById('p_serial')?.value.trim();if(!serialRaw||!/^\d+$/.test(serialRaw)||Number(serialRaw)<1){alert('შეიყვანე დადებითი მთელი რიგითი ნომერი.');return}const serialNo=Number(serialRaw);const sq=await db.from('persons').select('id').eq('serial_no',serialNo).limit(1);if(sq.error){alert('რიგითი ნომრის შემოწმების შეცდომა: '+sq.error.message);return}if(sq.data?.length&&sq.data[0].id!==editingId){alert('⚠️ რიგითი № '+serialNo+' უკვე მინიჭებულია სხვა პიროვნებაზე. მიუთითე სხვა ნომერი.');return}const payload={serial_no:serialNo,first_name:p_first.value.trim(),last_name:p_last.value.trim(),personal_id:p_pid.value.trim()||null,position:p_pos.value.trim()||null,room_no:(cab?(cab+(room?' '+room:'')):room)||null,floor:p_floor.value?Number(p_floor.value):null,mobile:contacts.join(' / ')||null,work_phone:p_work.value.trim()||null,ip_address:p_ip.value.trim()||null,mac_address:p_mac.value.trim()||null,notes:p_notes.value.trim()||null,employed:document.getElementById('p_employed')?.checked!==false};
 let result=editingId?await db.from('persons').update(payload).eq('id',editingId).select().single():await db.from('persons').insert(payload).select().single();
 if(result.error){alert('პიროვნების შენახვის შეცდომა: '+result.error.message);return}
 if(!editingId&&inventoryNo){
   if(!inventoryType){alert('პიროვნება დაემატა, მაგრამ საინვენტარო ტიპი არ აგირჩევია.');closeModal();await personsView();return}

   catch(err){alert('პიროვნება დაემატა, მაგრამ საინვენტარო ნომერი ვერ მიება:\n'+err.message);}

 closeModal();await personsView()}

async function checkPersonSerial(){const el=document.getElementById('p_serial_status');const inp=document.getElementById('p_serial');if(!el||!inp)return;const raw=inp.value.trim();if(!raw){el.innerHTML='<span style="color:#b91c1c">❌ მიუთითე რიგითი ნომერი.</span>';return}const n=Number(raw);if(!Number.isInteger(n)||n<1){el.innerHTML='<span style="color:#b91c1c">❌ რიგითი ნომერი უნდა იყოს დადებითი მთელი რიცხვი.</span>';return}const {data,error}=await db.from('persons').select('id,first_name,last_name').eq('serial_no',n).limit(1);if(error){el.innerHTML='<span style="color:#b91c1c">შემოწმების შეცდომა: '+esc(error.message)+'</span>';return}if(data?.length&&data[0].id!==editingId){el.innerHTML=`<span style="color:#b91c1c">🔴 რიგითი № ${n} დაკავებულია — ${esc(`${data[0].first_name||''} ${data[0].last_name||''}`.trim())}. მიუთითე სხვა ნომერი.</span>`}else el.innerHTML=`<span style="color:#15803d">🟢 რიგითი № ${n} თავისუფალია.</span>`}

async function deletePerson(id){const {data:p}=await db.from('persons').select('*').eq('id',id).single();if(!p)return;if(!confirm(`წაიშალოს ${p.first_name} ${p.last_name}?`))return;const n=await countPersonInventory(id);if(n){alert('პიროვნებაზე მიბმულია '+n+' საინვენტარო ობიექტი. ჯერ მოხსენით პასუხისმგებლობა.');return}const {error}=await db.from('persons').delete().eq('id',id);if(error)alert('წაშლის შეცდომა: '+error.message);else personsView()}

async function personInventory(pid){const {data:p,error}=await db.from('persons').select('*').eq('id',pid).single();if(error){alert(error.message);return}currentPerson=p;modalTitle.textContent='📦 '+p.first_name+' '+p.last_name+' — ინვენტარი';let all=[];for(const x of inventoryTables){const {data}=await db.from(x.table).select('*').eq('person_id',pid);for(const r of (data||[]))all.push({...r,_type:x.type,_table:x.table,_key:x.key,_name:r[x.nameField]||r.model||''})}recordForm.onsubmit=e=>e.preventDefault();recordForm.innerHTML=`<div class="person-box"><b>პასუხისმგებელი:</b> ${esc(p.first_name)} ${esc(p.last_name)}<br><b>თანამდებობა:</b> ${esc(p.position||'')}<br><b>კაბინეტი:</b> ${esc(p.room_no||'')} • <b>სართული:</b> ${esc(p.floor||'')}</div><div class="card" style="margin:12px 0;padding:14px;background:#f8fbff;border:1px solid #dbeafe"><h3 style="margin-top:0">➕ არსებული ინვენტარის ამ პიროვნებაზე დაწერა</h3><div class="grid"><div class="field"><label>1. აირჩიე ინვენტარის ტიპი *</label><select id="directInvType" onchange="prepareDirectInventory()"><option value="">აირჩიე...</option>${inventoryTables.map(x=>`<option value="${x.table}">${esc(x.type)}</option>`).join('')}</select></div><div class="field"><label>2. ჩაწერე საინვენტარო ნომერი *</label><input id="directInvNo" placeholder="მაგ. 12345" oninput="clearDirectInventoryStatus()" onblur="checkDirectInventory()"></div><div class="field full"><div id="directInvStatus" class="hint">ჯერ აირჩიე ინვენტარის ტიპი და ჩაწერე საინვენტარო ნომერი.</div></div></div><button class="btn btn-success" type="button" onclick="assignDirectInventory('${pid}')">🔗 დაწერა ამ პიროვნებაზე</button></div><div class="toolbar"><h3 style="margin-right:auto">მიბმული ინვენტარი (${all.length})</h3><button class="btn btn-warning" type="button" onclick="printPerson('${pid}')">🖨️ ბეჭდვა</button><button class="btn btn-primary" type="button" onclick="printAct('${pid}')">📄 მიღება-ჩაბარების აქტი</button></div><div class="table-wrap"><table><thead><tr><th>ტიპი</th><th>საინვენტარო №</th><th>ობიექტი</th><th>მოქმედება</th></tr></thead><tbody>${all.map(r=>`<tr><td>${esc(r._type)}</td><td><b>${esc(r.inventory_no)}</b></td><td>${esc(r._name)}<br>${r.active===false?'<span style="color:#dc2626;font-weight:700">🔴 უმოქმედო / შენახულია</span>':'<span style="color:#15803d">🟢 მოქმედებაშია</span>'}</td><td><button class="btn-danger" onclick="removeResponsibility('${r._table}','${r.id}','${pid}','${esc(r.inventory_no)}')">↩️ პასუხისმგებლობიდან მოხსნა</button></td></tr>`).join('')}</tbody></table></div><br><button class="btn btn-secondary" type="button" onclick="closeModal()">დახურვა</button>`;modal.classList.add('show')}

function clearDirectInventoryStatus(){const s=document.getElementById('directInvStatus');if(s)s.textContent='საინვენტარო ნომრის შემოწმება მიმდინარეობს ჩაწერის დასრულების შემდეგ.'}
async function checkDirectInventory(){const type=document.getElementById('directInvType')?.value;const inv=document.getElementById('directInvNo')?.value.trim();const s=document.getElementById('directInvStatus');if(!s)return;if(!type){s.innerHTML='<span style="color:#b91c1c">❌ ჯერ აირჩიე ინვენტარის ტიპი.</span>';return}if(!inv){s.textContent='ჩაწერე საინვენტარო ნომერი.';return}s.innerHTML='🔎 მოწმდება...';const {data:wo}=await db.from('inventory_writeoffs').select('*').eq('inventory_no',inv).order('writeoff_date',{ascending:false}).limit(1);const {data,error}=await db.from(type).select('*').eq('inventory_no',inv);if(error){s.innerHTML='<span style="color:#b91c1c">შემოწმების შეცდომა: '+esc(error.message)+'</span>';return}if(!data?.length){s.innerHTML=`<span style="color:#15803d">🟢 ამ კატეგორიაში ნომერი არ არსებობს — <b>შეიძლება ახალი ინვენტარის შექმნა და ამ პიროვნებაზე მიბმა.</b>${wo?.length?' <br>📕 ნომერი ჩამოწერის ისტორიაშიც ფიქსირდება.':''}</span>`;return}if(data.length>1){s.innerHTML='<span style="color:#b45309">⚠️ ეს საინვენტარო ნომერი ამ კატეგორიაში ერთზე მეტ ჩანაწერშია.</span>';return}const r=data[0];const hist=wo?.length?`<br><span style="color:#b91c1c">📕 ჩამოწერის ისტორიაში ფიქსირდება: ${esc(wo[0].writeoff_date||'')} — ${esc(wo[0].reason||'')}</span>`:'';if(!r.person_id){s.innerHTML='<span style="color:#15803d">🟢 არსებული ინვენტარი თავისუფალია — შეიძლება ამ პიროვნებაზე დაწერა.</span>'+hist}else{const {data:p}=await db.from('persons').select('first_name,last_name,personal_id').eq('id',r.person_id).single();const owner=p?`${p.first_name||''} ${p.last_name||''}`.trim():'უცნობი მომხმარებელი';s.innerHTML=`<span style="color:#b45309">🟠 დაკავებულია — მომხმარებელი: <b>${esc(owner)}</b>${p?.personal_id?' • ID: '+esc(p.personal_id):''}. დადასტურებისას ძველი მომხმარებელი გათავისუფლდება.</span>${hist}`}}
async function assignDirectInventory(newPid){const type=document.getElementById('directInvType')?.value;const inv=document.getElementById('directInvNo')?.value.trim();if(!type){alert('ჯერ აირჩიე ინვენტარის ტიპი.');return}if(!inv){alert('ჩაწერე საინვენტარო ნომერი.');return}const {data:wo}=await db.from('inventory_writeoffs').select('*').eq('inventory_no',inv).order('writeoff_date',{ascending:false}).limit(1);const {data,error}=await db.from(type).select('*').eq('inventory_no',inv);if(error){alert('შემოწმების შეცდომა: '+error.message);return}if(!data?.length){const typeLabel=inventoryTables.find(x=>x.table===type)?.type||type;const msg=wo?.length?`📕 ნომერი ${inv} ჩამოწერის ისტორიაში ფიქსირდება.\nთარიღი: ${wo[0].writeoff_date||'-'}\nმიზეზი: ${wo[0].reason||'-'}\n\nმიუხედავად ამისა, გსურთ ამ ნომრით ახალი აქტიური ინვენტარის ჩანაწერის შექმნა და ამ პიროვნებაზე დაწერა?`:`საინვენტარო ნომერი ${inv} ამ კატეგორიაში არ არსებობს.\n\nგსურთ ახალი ${typeLabel}-ის ჩანაწერის შექმნა და ამ პიროვნებაზე დაწერა?`;if(!confirm(msg))return;const cfg=Object.values(configs).find(c=>c.table===type);const payload={inventory_no:inv,person_id:newPid};const nameField=cfg?.fields.find(f=>f[0]==='name');if(nameField){const name=prompt(`შეიყვანე ახალი ინვენტარის დასახელება (${typeLabel}):`,'');if(name===null)return;if(!name.trim()){alert('❌ ინვენტარის დასახელება აუცილებელია.');return}payload.name=name.trim()}if(type==='internal_drives'||type==='external_drives'){const d=prompt('მიუთითე დისკის ტიპი: HDD ან SSD','HDD');if(d===null)return;const dt=d.trim().toUpperCase();if(!['HDD','SSD'].includes(dt)){alert('❌ დისკის ტიპი უნდა იყოს HDD ან SSD.');return}payload.drive_type=dt}const cr=await db.from(type).insert(payload).select('*').single();if(cr.error){alert('❌ ახალი ინვენტარის შექმნა ვერ მოხერხდა: '+cr.error.message);return}await logHistory(inv,type,null,newPid,wo?.length?'ჩამოწერილი ნომერი ხელახლა შემოვიდა და მიება პიროვნებას':'ახალი ინვენტარი შემოვიდა და მიება პიროვნებას');alert(wo?.length?'📕 ჩამოწერილი ნომერი დაფიქსირდა ისტორიაში და შეიქმნა ახალი აქტიური ინვენტარი — პიროვნებას მიება.':'✅ ახალი ინვენტარი შეიქმნა და პიროვნებას მიება.');await personInventory(newPid);return}if(data.length>1){alert('⚠️ ეს საინვენტარო ნომერი ერთზე მეტ ჩანაწერშია.');return}const item=data[0];if(item.person_id&&String(item.person_id)===String(newPid)){alert(wo?.length?'📕 ეს ნომერი ამ პიროვნებაზეა მიბმული და ჩამოწერის ისტორიაშიც ფიქსირდება.':'ℹ️ ეს საინვენტარო ნომერი უკვე ამ პიროვნებაზეა დაწერილი.');return}let fromPid=item.person_id||null;if(fromPid){const {data:old}=await db.from('persons').select('first_name,last_name,personal_id').eq('id',fromPid).single();const owner=old?`${old.first_name||''} ${old.last_name||''}`.trim():'უცნობი მომხმარებელი';const ok=confirm(`საინვენტარო ნომერი ${inv} უკვე დაკავებულია.\n\nამჟამინდელი მომხმარებელი: ${owner}${old?.personal_id?' (ID: '+old.personal_id+')':''}${wo?.length?'\n\n📕 ეს ნომერი ასევე ფიქსირდება ჩამოწერის ისტორიაში.':''}\n\nგადავაბაროთ ახალ პიროვნებაზე?`);if(!ok)return;const oldErr=await db.from(type).update({person_id:null}).eq('id',item.id);if(oldErr.error){alert('❌ ძველი მომხმარებლისგან გათავისუფლება ვერ მოხერხდა: '+oldErr.error.message);return}}const ne=await db.from(type).update({person_id:newPid}).eq('id',item.id);if(ne.error){alert('❌ ახალ პიროვნებაზე დაწერა ვერ მოხერხდა: '+ne.error.message);return}await logHistory(inv,type,fromPid,newPid,wo?.length?'ჩამოწერილი ნომერი მიება პიროვნებას':(fromPid?'ინვენტარი გადაეცა ახალ პასუხისმგებელ პირს':'თავისუფალი ინვენტარი მიენიჭა პასუხისმგებელ პირს'));alert(wo?.length?'📕 ნომერი ჩამოწერის ისტორიაშიც ფიქსირდება და ამ პიროვნებაზე წარმატებით მიება.':(fromPid?'✅ ინვენტარი გადმოეწერა ახალ პიროვნებას.':'✅ ინვენტარი წარმატებით დაეწერა პიროვნებას.'));await personInventory(newPid)}
async function openAssign(pid){return personInventory(pid)}
function filterAssign(){const q=(document.getElementById('assignSearch')?.value||'').toLowerCase();document.querySelectorAll('#assignSelect option').forEach(o=>o.hidden=!o.textContent.toLowerCase().includes(q))}
async function assignSelected(newPid){const v=document.getElementById('assignSelect')?.value;if(!v){alert('აირჩიე საინვენტარო ობიექტი.');return}const [table,id]=v.split('|');await assignInventory(table,id,newPid)}
async function assignInventory(table,id,newPid){const {data:item,error}=await db.from(table).select('*').eq('id',id).single();if(error){alert(error.message);return}if(item.person_id&&item.person_id!==newPid){const {data:old}=await db.from('persons').select('*').eq('id',item.person_id).single();const ok=confirm(`ეს ინვენტარი უკვე აწერია ${old?.first_name||''} ${old?.last_name||''}-ს.\n\nგსურს თანხმობით გადაცემა ახალ პასუხისმგებელზე?`);if(!ok)return;await db.from(table).update({person_id:newPid}).eq('id',id);await logHistory(item.inventory_no,table,item.person_id,newPid,'პასუხისმგებლობის გადაცემა — მომხმარებლის თანხმობით');}else{await db.from(table).update({person_id:newPid}).eq('id',id);await logHistory(item.inventory_no,table,null,newPid,'ახალი პასუხისმგებლობის მინიჭება')}if((await db.from(table).select('id').eq('id',id)).error){return}alert('✅ ინვენტარი წარმატებით მიება პასუხისმგებელ პირს.');await personInventory(newPid)}
async function removeResponsibility(table,id,pid,inv){if(!confirm('მოიხსნას ეს ინვენტარი პასუხისმგებლობიდან?'))return;const {error}=await db.from(table).update({person_id:null}).eq('id',id);if(error){alert('შეცდომა: '+error.message);return}await logHistory(inv,table,pid,null,'პასუხისმგებლობიდან მოხსნა');await personInventory(pid)}
async function logHistory(inv,table,fromPid,toPid,comment){const {error}=await db.from('responsibility_history').insert({inventory_no:inv,inventory_type:table,from_person_id:fromPid||null,to_person_id:toPid||null,comment:comment||null});if(error)console.warn('history:',error.message)}

async function findInventoryStatus(inv){inv=String(inv||'').trim();if(!inv)return {status:'none'};const {data:wo}=await db.from('inventory_writeoffs').select('*').eq('inventory_no',inv).order('writeoff_date',{ascending:false}).limit(1);if(wo?.length)return {status:'written',writeoff:wo[0]};for(const x of inventoryTables){const {data,error}=await db.from(x.table).select('*').eq('inventory_no',inv).limit(1);if(error)continue;if(data?.length)return {status:data[0].person_id?'used':'free',table:x.table,type:x.type,row:data[0]}}return {status:'none'}}
async function checkInventoryStatus(inv){const el=document.getElementById('inventoryStatus');if(!el)return;if(!inv.trim()){el.innerHTML='';return}el.innerHTML='<div class="inv-status">🔎 მოწმდება...</div>';const r=await findInventoryStatus(inv);if(r.status==='free')el.innerHTML='<div class="inv-status inv-free">🟡 არსებობს და თავისუფალია — შეიძლება პასუხისმგებელ პირზე მიბმა.</div>';else if(r.status==='used')el.innerHTML=`<div class="inv-status inv-used">🟢 უკვე გამოყენებაშია. პასუხისმგებელი პირის ID: ${esc(r.row.person_id)}</div>`;else if(r.status==='written')el.innerHTML=`<div class="inv-status inv-written">🔴 ჩამოწერილია. მიზეზი: ${esc(r.writeoff?.reason||'')}</div>`;else el.innerHTML='<div class="inv-status inv-none">⚪ ასეთი საინვენტარო ნომერი არ მოიძებნა.</div>'}

function openAdd(){editingId=null;modalTitle.textContent='➕ ახალი ჩანაწერი';buildGenericForm({});modal.classList.add('show')}
function buildGenericForm(row){const c=configs[currentType];recordForm.onsubmit=saveRecord;recordForm.innerHTML='<div class="grid">'+c.fields.map(f=>{const[n,l,t,req]=f;let v=esc(row[n]??'');let extra='';if(n==='former_user'&&currentType==='writeoffs')extra=' list="formerUsersList" oninput="checkFormerUser(this.value)"';if(n==='serial_no'&&currentType==='writeoffs')extra=' min="1" step="1" onblur="checkWriteoffSerial(this.value)"';let inp=t==='checkbox'?`<input id="f_${n}" type="checkbox" ${row[n]!==false?'checked':''}>`:t.startsWith('select:')?`<select id="f_${n}" ${req?'required':''}><option value="">აირჩიე...</option>${t.split(':')[1].split(',').map(o=>`<option ${row[n]===o?'selected':''}>${o}</option>`).join('')}</select>`:t==='textarea'?`<textarea id="f_${n}" ${req?'required':''}>${v}</textarea>`:`<input id="f_${n}" type="${t}" value="${v}" ${req?'required':''}${extra}${n==='inventory_no'?` onblur="checkInventoryStatus(this.value)"`:''}>`;return `<div class="field ${t==='textarea'?'full':''}"><label>${l}${req?' *':''}</label>${inp}${n==='inventory_no'?'<div id="inventoryStatus"></div>':''}${n==='serial_no'&&currentType==='writeoffs'?'<div id="serialStatus" style="margin-top:6px"></div>':''}${n==='former_user'?'<datalist id="formerUsersList"></datalist><div id="formerUserStatus" style="margin-top:6px"></div>':''}</div>`}).join('')+'</div><br><button class="btn btn-primary" type="submit">💾 შენახვა</button> <button class="btn btn-secondary" type="button" onclick="closeModal()">გაუქმება</button>';if(currentType==='writeoffs')loadFormerUsers(row.former_user||'')}
async function loadFormerUsers(selected=''){const dl=document.getElementById('formerUsersList');if(!dl)return;const {data}=await db.from('persons').select('first_name,last_name,personal_id').order('first_name');dl.innerHTML=(data||[]).map(p=>`<option value="${esc(`${p.first_name||''} ${p.last_name||''}`.trim())}">${esc(p.personal_id||'')}</option>`).join('');if(selected)checkFormerUser(selected)}
async function checkFormerUser(value){const el=document.getElementById('formerUserStatus');if(!el)return;const q=String(value||'').trim();if(!q){el.innerHTML='';return}const {data}=await db.from('persons').select('id,first_name,last_name,personal_id').or(`first_name.ilike.%${q.replace(/,/g,'')}%,last_name.ilike.%${q.replace(/,/g,'')}%`).limit(5);const exact=(data||[]).find(p=>`${p.first_name||''} ${p.last_name||''}`.trim().toLowerCase()===q.toLowerCase());if(exact)el.innerHTML=`<span style="color:#15803d">🟢 ყოფილი მომხმარებელი ნაპოვნია: <b>${esc(`${exact.first_name||''} ${exact.last_name||''}`.trim())}</b>${exact.personal_id?' • ID: '+esc(exact.personal_id):''}</span>`;else if(data?.length)el.innerHTML='<span style="color:#b45309">🟠 მსგავსი პიროვნება მოიძებნა — აირჩიე სიიდან ან ჩაწერე ხელით.</span>';else el.innerHTML='<span style="color:#64748b">✍️ ასეთი პიროვნება ბაზაში ვერ მოიძებნა — შეგიძლია სახელი და გვარი ხელით ჩაწერო.</span>'}
async function checkWriteoffSerial(value){const el=document.getElementById('serialStatus');if(!el)return;const n=Number(String(value||'').trim());if(!Number.isInteger(n)||n<1){el.innerHTML='<span style="color:#b91c1c">❌ შეიყვანე დადებითი მთელი რიცხვი.</span>';return}const q=await db.from('inventory_writeoffs').select('id,serial_no').eq('serial_no',n).limit(1);if(q.error){el.innerHTML='<span style="color:#b91c1c">შემოწმების შეცდომა: '+esc(q.error.message)+'</span>';return}if(q.data?.length&&(!editingId||q.data[0].id!==editingId)){const all=await db.from('inventory_writeoffs').select('serial_no').not('serial_no','is',null);const used=new Set((all.data||[]).map(x=>Number(x.serial_no)).filter(Number.isInteger));let next=1;while(used.has(next))next++;el.innerHTML='<span style="color:#b45309">⚠️ რიგითი № '+n+' უკვე დაკავებულია.</span>';if(confirm('რიგითი № '+n+' უკვე დაკავებულია.\n\nგსურთ ავტომატურად მიენიჭოს შემდეგი თავისუფალი № '+next+'?')){const inp=document.getElementById('f_serial_no');if(inp){inp.value=next;el.innerHTML='<span style="color:#15803d">🟢 მიენიჭა თავისუფალი რიგითი № '+next+'.</span>'}}}else el.innerHTML='<span style="color:#15803d">🟢 რიგითი № '+n+' თავისუფალია.</span>'}
async function saveRecord(e){e.preventDefault();const c=configs[currentType],payload={};c.fields.forEach(f=>{const el=document.getElementById('f_'+f[0]);if(!el)return;if(f[2]==='checkbox'){payload[f[0]]=el.checked;return}const v=el.value.trim();payload[f[0]]=v===''?null:(f[2]==='number'?Number(v):v)});if(currentType==='writeoffs'&&payload.serial_no){const q=await db.from('inventory_writeoffs').select('id').eq('serial_no',payload.serial_no).limit(1);if(q.error){alert('რიგითი ნომრის შემოწმების შეცდომა: '+q.error.message);return}if(q.data?.length&&(!editingId||q.data[0].id!==editingId)){alert('⚠️ რიგითი № '+payload.serial_no+' უკვე დაკავებულია. მიუთითე სხვა თავისუფალი ციფრი.');return}}if(payload.inventory_no){const st=await findInventoryStatus(payload.inventory_no);if(currentType!=='writeoffs'&&st.status==='written'){alert('⚠️ ეს საინვენტარო ნომერი უკვე ჩამოწერილია.');return}if(currentType!=='writeoffs'&&st.status==='used'&&(!editingId||st.row.id!==editingId)){alert('⚠️ ეს საინვენტარო ნომერი უკვე სხვა ჩანაწერზეა მინიჭებული. გამოიყენე „პასუხისმგებლობაზე მიბმა“ გადაცემისთვის.');return}}const result=editingId?await db.from(c.table).update(payload).eq('id',editingId).select().single():await db.from(c.table).insert(payload).select().single();if(result.error){alert('შენახვის შეცდომა: '+result.error.message);return}closeModal();loadRecords()}
async function editRecord(id){const c=configs[currentType],{data,error}=await db.from(c.table).select('*').eq('id',id).single();if(error){alert(error.message);return}editingId=id;modalTitle.textContent='✏️ ჩანაწერის შესწორება';buildGenericForm(data);modal.classList.add('show')}
async function deleteRecord(id){if(!confirm('ნამდვილად გსურთ ამ ჩანაწერის წაშლა?'))return;const c=configs[currentType];const {error}=await db.from(c.table).delete().eq('id',id);if(error)alert('წაშლის შეცდომა: '+error.message);else loadRecords()}

async function messengerView(){
  currentType='messenger';
  if(!sb||offlineMode||!currentAuthUser?.id){section.innerHTML='<div class="card"><h2>💬 მესენჯერი</h2><p>მესენჯერი მუშაობს მხოლოდ ინტერნეტთან დაკავშირებულ რეჟიმში. Offline რეჟიმში ჩატი დროებით მიუწვდომელია.</p></div>';return}
  section.innerHTML='<div class="messenger-shell"><div class="messenger-users"><div style="padding:14px;border-bottom:1px solid #e5e7eb"><b>👥 თანამშრომლები</b><input id="messengerSearch" class="search" style="max-width:none;margin-top:10px" placeholder="🔎 ძებნა..." oninput="filterMessengerUsers()"></div><div id="messengerUserList"></div></div><div class="chat-panel"><div id="chatHead" class="chat-head">აირჩიე თანამშრომელი</div><div id="chatMessages" class="chat-messages"><div class="empty-chat">მარცხნივ აირჩიე თანამშრომელი, რომ დაიწყოთ მიმოწერა.</div></div><div class="chat-compose"><textarea id="chatInput" placeholder="დაწერე შეტყობინება..." onkeydown="messengerKeydown(event)"></textarea><button class="btn btn-primary" onclick="sendMessengerMessage()">გაგზავნა</button></div></div></div>';
  const {data,error}=await sb.from('messenger_profiles').select('user_id,display_name,email,active').eq('active',true).neq('user_id',currentAuthUser.id).order('display_name');
  if(error){setStatus('მესენჯერის შეცდომა: '+error.message,true);return}
  messengerProfiles=data||[];renderMessengerUsers();
  if(messengerChannel)sb.removeChannel(messengerChannel);
  messengerChannel=sb.channel('messenger-realtime').on('postgres_changes',{event:'INSERT',schema:'public',table:'messenger_messages'},payload=>{const m=payload.new;if(m.sender_id===currentAuthUser.id||m.recipient_id===currentAuthUser.id){if(messengerSelectedUser&&(m.sender_id===messengerSelectedUser.user_id||m.recipient_id===messengerSelectedUser.user_id))loadMessengerMessages();}}).on('postgres_changes',{event:'DELETE',schema:'public',table:'messenger_messages'},payload=>{const m=payload.old;if(messengerSelectedUser&&(m.sender_id===messengerSelectedUser.user_id||m.recipient_id===messengerSelectedUser.user_id))loadMessengerMessages();}).subscribe();
}
function renderMessengerUsers(){const box=document.getElementById('messengerUserList');if(!box)return;const q=(document.getElementById('messengerSearch')?.value||'').toLowerCase();box.innerHTML=messengerProfiles.filter(p=>`${p.display_name||''} ${p.email||''}`.toLowerCase().includes(q)).map(p=>`<button class="messenger-user ${messengerSelectedUser?.user_id===p.user_id?'active':''}" onclick="selectMessengerUser('${p.user_id}')"><b><span class="online-dot"></span>${esc(p.display_name||p.email||'მომხმარებელი')}</b><small>${esc(p.email||'')}</small></button>`).join('')||'<div style="padding:18px;color:#64748b">თანამშრომლები არ მოიძებნა.</div>'}
function filterMessengerUsers(){renderMessengerUsers()}
async function selectMessengerUser(uid){messengerSelectedUser=messengerProfiles.find(x=>x.user_id===uid)||null;renderMessengerUsers();const h=document.getElementById('chatHead');if(h)h.textContent='💬 '+(messengerSelectedUser?.display_name||messengerSelectedUser?.email||'თანამშრომელი');await loadMessengerMessages();document.getElementById('chatInput')?.focus()}
async function loadMessengerMessages(){if(!messengerSelectedUser||!currentAuthUser?.id||!sb)return;const {data,error}=await sb.from('messenger_messages').select('id,sender_id,recipient_id,body,created_at').or(`and(sender_id.eq.${currentAuthUser.id},recipient_id.eq.${messengerSelectedUser.user_id}),and(sender_id.eq.${messengerSelectedUser.user_id},recipient_id.eq.${currentAuthUser.id})`).order('created_at',{ascending:true}).limit(500);if(error){setStatus('შეტყობინებების ჩატვირთვის შეცდომა: '+error.message,true);return}const box=document.getElementById('chatMessages');if(!box)return;box.innerHTML=(data||[]).map(m=>{const mine=m.sender_id===currentAuthUser.id;const dt=new Date(m.created_at).toLocaleString('ka-GE',{dateStyle:'short',timeStyle:'short'});return `<div class="msg ${mine?'mine':''}"><div class="bubble"><div>${esc(m.body).replace(/\n/g,'<br>')}</div><div class="meta"><span>${dt}</span>${mine?`<button onclick="deleteMessengerMessage('${m.id}')">🗑️ წაშლა</button>`:''}</div></div></div>`}).join('')||'<div class="empty-chat">ჯერ შეტყობინება არ არის. დაწერე პირველი შეტყობინება.</div>';box.scrollTop=box.scrollHeight}
function messengerKeydown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessengerMessage()}}
async function sendMessengerMessage(){if(!messengerSelectedUser||!currentAuthUser?.id||!sb){alert('ჯერ აირჩიე თანამშრომელი.');return}const input=document.getElementById('chatInput');const body=input?.value.trim();if(!body)return;const {error}=await sb.from('messenger_messages').insert({sender_id:currentAuthUser.id,recipient_id:messengerSelectedUser.user_id,body});if(error){alert('შეტყობინების გაგზავნა ვერ მოხერხდა: '+error.message);return}input.value='';await loadMessengerMessages()}
async function deleteMessengerMessage(id){if(!confirm('წაიშალოს ეს შეტყობინება?'))return;const {error}=await sb.from('messenger_messages').delete().eq('id',id).eq('sender_id',currentAuthUser.id);if(error)alert('წაშლის შეცდომა: '+error.message);else loadMessengerMessages()}

async function historyView(){currentType='history';section.innerHTML='<div class="card"><div class="toolbar"><h2 style="margin-right:auto">🔄 პასუხისმგებლობის გადაცემის ისტორია</h2><input class="search" id="historySearch" placeholder="🔎 ძებნა..." oninput="filterTableGeneric(\'historyBody\')"></div><div class="table-wrap"><table><thead><tr><th>თარიღი</th><th>საინვენტარო №</th><th>ტიპი</th><th>ძველი პასუხისმგებელი</th><th>ახალი პასუხისმგებელი</th><th>კომენტარი</th></tr></thead><tbody id="historyBody"></tbody></table></div></div>';const {data,error}=await db.from('responsibility_history').select('*').order('changed_at',{ascending:false});if(error){setStatus('ისტორიის შეცდომა: '+error.message,true);return}let people={};const ids=[...(data||[]).flatMap(x=>[x.from_person_id,x.to_person_id]).filter(Boolean)];if(ids.length){const {data:ps}=await db.from('persons').select('id,first_name,last_name').in('id',ids);(ps||[]).forEach(p=>people[p.id]=p.first_name+' '+p.last_name)}historyBody.innerHTML=(data||[]).map(r=>`<tr data-search="${esc(Object.values(r).join(' ').toLowerCase())}"><td>${esc(r.changed_at||r.created_at||'')}</td><td>${esc(r.inventory_no)}</td><td>${esc(r.inventory_type)}</td><td>${esc(people[r.from_person_id]||r.from_person_id||'—')}</td><td>${esc(people[r.to_person_id]||r.to_person_id||'—')}</td><td>${esc(r.comment||'')}</td></tr>`).join('')}
function filterTableGeneric(id){const q=(document.getElementById(id.replace('Body','Search'))?.value||'').toLowerCase();document.querySelectorAll('#'+id+' tr').forEach(r=>r.style.display=(r.dataset.search||'').includes(q)?'':'none')}

async function globalSearchView(){section.innerHTML=`<div class="card"><div class="toolbar"><h2 style="margin-right:auto">🔎 მთელ სისტემაში საინვენტარო ნომრის ძებნა</h2><input id="globalInv" class="search" placeholder="შეიყვანე საინვენტარო №"><select id="globalStatus" style="max-width:220px"><option value="all">ყველა</option><option value="free">🟡 თავისუფალი</option><option value="used">🟢 გამოყენებაში</option><option value="written">🔴 ჩამოწერილი</option></select><button class="btn btn-primary" onclick="runGlobalSearch()">ძებნა</button></div><div id="globalResults"></div></div>`;globalInv.focus()}
async function runGlobalSearch(){const q=globalInv.value.trim().toLowerCase();if(!q){globalResults.innerHTML='<div class="status">შეიყვანე საინვენტარო ნომერი.</div>';return}let rows=[];for(const x of inventoryTables){const {data,error}=await db.from(x.table).select('*');if(error)continue;for(const r of (data||[])){if(String(r.inventory_no||'').toLowerCase().includes(q))rows.push({...r,_type:x.type,_table:x.table,_name:r[x.nameField]||r.model||''})}}const {data:wo}=await db.from('inventory_writeoffs').select('*');for(const r of (wo||[])){if(String(r.inventory_no||'').toLowerCase().includes(q))rows.push({...r,_type:'📕 ჩამოწერილი',_written:true,_name:r.object_name||''})}const filtered=rows.filter(r=>{const s=r._written?'written':r.person_id?'used':'free';return globalStatus.value==='all'||globalStatus.value===s});if(!filtered.length){globalResults.innerHTML='<div class="inv-status inv-none">⚪ ასეთი ნომერი არ მოიძებნა.</div>';return}const people={};const ids=filtered.map(r=>r.person_id).filter(Boolean);if(ids.length){const {data:ps}=await db.from('persons').select('id,first_name,last_name').in('id',ids);(ps||[]).forEach(p=>people[p.id]=p.first_name+' '+p.last_name)}globalResults.innerHTML=`<div class="table-wrap"><table><thead><tr><th>სტატუსი</th><th>ტიპი</th><th>№</th><th>ობიექტი</th><th>პასუხისმგებელი</th><th>მოქმედება</th></tr></thead><tbody>${filtered.map(r=>{const s=r._written?'written':r.person_id?'used':'free';return `<tr><td>${s==='free'?'🟡 თავისუფალი':s==='used'?'🟢 გამოყენებაში':'🔴 ჩამოწერილი'}</td><td>${esc(r._type)}</td><td><b>${esc(r.inventory_no)}</b></td><td>${esc(r._name)}</td><td>${esc(people[r.person_id]||r.person_id||'—')}</td><td>${s==='free'?'<span class="badge">თავისუფალია — შესაძლებელია მიბმა</span>':s==='used'?'<span class="badge">გადაცემა შესაძლებელია თანხმობით</span>':'<span class="badge">ჩამოწერილია</span>'}</td></tr>`}).join('')}</tbody></table></div>`}

async function getPersonAll(pid){let all=[];for(const x of inventoryTables){const {data}=await db.from(x.table).select('*').eq('person_id',pid);for(const r of (data||[]))all.push({...r,_type:x.type,_name:r[x.nameField]||r.model||''})}return all}
async function printPerson(pid){const {data:p}=await db.from('persons').select('*').eq('id',pid).single();if(!p)return;const inv=await getPersonAll(pid);const w=window.open('','_blank');w.document.write(`<html><head><meta charset="UTF-8"><title>ინვენტარი — ${esc(p.first_name)} ${esc(p.last_name)}</title><style>body{font-family:Arial,sans-serif;padding:30px}h2{text-align:center}table{width:100%;border-collapse:collapse}th,td{border:1px solid #777;padding:7px;text-align:left}th{background:#eee}.info{margin-bottom:18px;line-height:1.8}</style></head><body><h2>პიროვნებაზე მიბმული საინვენტარო სია</h2><div class="info"><b>სახელი გვარი:</b> ${esc(p.first_name)} ${esc(p.last_name)}<br><b>პირადი ID:</b> ${esc(p.personal_id)}<br><b>თანამდებობა:</b> ${esc(p.position)}<br><b>კაბინეტი:</b> ${esc(p.room_no)}<br><b>სართული:</b> ${esc(p.floor)}<br><b>კონტაქტები:</b> ${esc(p.mobile)}<br><b>შიდა ნომერი:</b> ${esc(p.work_phone)}</div><table><tr><th>#</th><th>ტიპი</th><th>საინვენტარო №</th><th>დასახელება</th></tr>${inv.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r._type)}</td><td>${esc(r.inventory_no)}</td><td>${esc(r._name)}</td></tr>`).join('')}</table><p style="margin-top:30px">თარიღი: ${new Date().toLocaleDateString('ka-GE')}</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
async function printAct(pid){const {data:p}=await db.from('persons').select('*').eq('id',pid).single();if(!p)return;const inv=await getPersonAll(pid);const w=window.open('','_blank');w.document.write(`<html><head><meta charset="UTF-8"><title>მიღება-ჩაბარების აქტი</title><style>body{font-family:Arial,sans-serif;padding:35px}h2{text-align:center}p{line-height:1.7}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #555;padding:7px}.sign{display:flex;justify-content:space-between;margin-top:70px}</style></head><body><h2>მიღება-ჩაბარების აქტი</h2><p>წინამდებარე აქტით დასტურდება, რომ საინვენტარო ობიექტები გადაეცა პასუხისმგებელ პირს:</p><p><b>პირი:</b> ${esc(p.first_name)} ${esc(p.last_name)}<br><b>პირადი ID:</b> ${esc(p.personal_id)}<br><b>თანამდებობა:</b> ${esc(p.position)}<br><b>კაბინეტი:</b> ${esc(p.room_no)}<br><b>სართული:</b> ${esc(p.floor)}</p><table><tr><th>#</th><th>ტიპი</th><th>საინვენტარო №</th><th>დასახელება</th></tr>${inv.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r._type)}</td><td>${esc(r.inventory_no)}</td><td>${esc(r._name)}</td></tr>`).join('')}</table><p>პასუხისმგებელი პირი ადასტურებს, რომ აღნიშნული ინვენტარი ჩაიბარა და პასუხისმგებლობას იღებს მის შენახვასა და გამოყენებაზე.</p><div class="sign"><div>გადამცემი: __________________</div><div>მიმღები: __________________</div></div><p style="margin-top:30px">თარიღი: ${new Date().toLocaleDateString('ka-GE')}</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function closeModal(){modal.classList.remove('show');recordForm.onsubmit=null}window.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});init();
</script></body></html>
